<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>财务健康 · 总览</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="base.css">
  <style>
    .net-worth-card {
      margin: 0 24px 20px;
      background: linear-gradient(135deg, #1a1f14, #141a1a);
      border-radius: 28px; padding: 28px 24px 22px;
      border: 1px solid rgba(200,240,80,0.2); position: relative; overflow: hidden;
    }
    .net-worth-card::before {
      content:''; position:absolute; top:-60px; right:-60px;
      width:200px; height:200px;
      background:radial-gradient(circle, rgba(200,240,80,0.08) 0%, transparent 70%);
    }
    .nw-label { font-size:12px; color:var(--text-muted); margin-bottom:8px; }
    .nw-amount { font-size:38px; font-weight:800; color:var(--text); letter-spacing:-1px; }
    .nw-badges { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
    .nw-badge  {
      font-size:12px; font-weight:600; padding:4px 12px;
      border-radius:20px; display:flex; align-items:center; gap:4px;
    }

    .score-row { display:flex; gap:12px; margin:0 24px 20px; }
    .score-card {
      flex:1; background:var(--surface); border-radius:20px;
      padding:16px; border:1px solid var(--border); position:relative; overflow:hidden;
    }
    .score-ring-wrap { position:relative; width:72px; height:72px; margin:0 auto 10px; }
    .score-ring-wrap svg { width:100%; height:100%; transform:rotate(-90deg); }
    .score-center {
      position:absolute; inset:0; display:flex;
      flex-direction:column; align-items:center; justify-content:center; line-height:1;
    }
    .score-num { font-size:22px; font-weight:800; color:var(--text); }
    .score-sub { font-size:9px; color:var(--text-muted); margin-top:2px; }
    .score-label { text-align:center; font-size:11px; color:var(--text-muted); }

    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 24px 20px; }
    .stat-card {
      background:var(--surface); border-radius:16px;
      padding:16px; border:1px solid var(--border);
    }
    .stat-label { font-size:11px; color:var(--text-muted); margin-bottom:6px; letter-spacing:0.02em; }
    .stat-val   { font-size:20px; font-weight:700; color:var(--text); }

    .chart-card {
      margin:0 24px 20px; background:var(--surface);
      border-radius:20px; padding:18px; border:1px solid var(--border);
    }
    .chart-title { font-size:13px; font-weight:600; color:var(--text); margin-bottom:14px; }
    .pie-wrap { display:flex; align-items:center; gap:16px; }
    .pie-legend { flex:1; display:flex; flex-direction:column; gap:8px; }
    .legend-item { display:flex; align-items:center; gap:8px; }
    .legend-dot  { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .legend-name { font-size:12px; color:var(--text-muted); flex:1; }
    .legend-pct  { font-size:12px; font-weight:600; color:var(--text); }

    .trend-card {
      margin:0 24px 20px; background:var(--surface);
      border-radius:20px; padding:18px; border:1px solid var(--border);
    }
    .trend-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .trend-title  { font-size:13px; font-weight:600; color:var(--text); }
    .trend-latest { font-size:13px; font-weight:700; color:var(--accent); }

    .user-bar {
      display:flex; justify-content:space-between; align-items:center;
      padding:0 24px 16px;
    }
    .user-email { font-size:12px; color:var(--text-muted); }
    .logout-btn {
      font-size:12px; color:var(--text-muted); background:none; border:none;
      cursor:pointer; padding:4px 8px; border-radius:8px;
      font-family:inherit;
    }
    .logout-btn:hover { color:var(--warn); }

    .loading-screen {
      position:fixed; inset:0; background:var(--bg);
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:12px; z-index:200;
    }
    .loading-screen .spin {
      width:36px; height:36px; border:3px solid var(--border);
      border-top-color:var(--accent); border-radius:50%;
      animation:spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-screen p { font-size:13px; color:var(--text-muted); }
  </style>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f0f13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="财务健康">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

<div class="loading-screen" id="loading">
  <div class="spin"></div>
  <p>加载中…</p>
</div>

<div class="phone" id="app" style="display:none">
  <div class="status-bar">
    <span class="status-time" id="clock">9:41</span>
    <div class="status-icons">
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="2.5" stroke="white" stroke-width="1.2" fill="none" opacity="0.8"/><rect x="1.5" y="2.5" width="16" height="7" rx="1.5" fill="white"/><rect x="23" y="4" width="2" height="4" rx="1" fill="white" opacity="0.5"/></svg>
    </div>
  </div>

  <div class="screen-content">
    <div class="user-bar">
      <span class="user-email" id="user-email"></span>
      <button class="logout-btn" id="logout-btn">退出</button>
    </div>

    <!-- 净资产卡 -->
    <div class="net-worth-card">
      <div class="nw-label">💼 净资产</div>
      <div class="nw-amount" id="nw-amount">—</div>
      <div class="nw-badges">
        <div class="nw-badge" id="nw-change-badge" style="display:none"></div>
        <div class="nw-badge" id="nw-debt-badge"   style="display:none"></div>
      </div>
    </div>

    <!-- 健康分 & 快速统计 -->
    <div class="score-row">
      <div class="score-card">
        <div class="score-ring-wrap">
          <svg viewBox="0 0 72 72">
            <circle fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6" cx="36" cy="36" r="28"/>
            <circle fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"
              cx="36" cy="36" r="28"
              id="score-circle"
              stroke-dasharray="175.9"
              stroke-dashoffset="175.9"/>
          </svg>
          <div class="score-center">
            <span class="score-num" id="score-num">—</span>
            <span class="score-sub">/100</span>
          </div>
        </div>
        <div class="score-label">财务健康分</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:10px">
        <div class="stat-card" style="background:#18181f;border:1px solid rgba(255,255,255,0.08)">
          <div class="stat-label">负债率</div>
          <div class="stat-val" id="debt-ratio" style="color:var(--text)">—</div>
        </div>
        <div class="stat-card" style="background:#18181f;border:1px solid rgba(255,255,255,0.08)">
          <div class="stat-label">资产项目</div>
          <div class="stat-val" id="asset-count" style="color:var(--text)">—</div>
        </div>
      </div>
    </div>

    <!-- 资产分布饼图 -->
    <div class="chart-card">
      <div class="chart-title">资产分布</div>
      <div class="pie-wrap" id="pie-wrap">
        <div style="color:var(--text-muted);font-size:13px">去资产页添加你的资产</div>
      </div>
    </div>

    <!-- 净资产趋势 -->
    <div class="trend-card">
      <div class="trend-header">
        <span class="trend-title">净资产趋势</span>
        <span class="trend-latest" id="trend-latest"></span>
      </div>
      <div id="trend-chart"></div>
    </div>

  </div>

  <nav class="nav-bar">
    <a href="index.html" class="nav-item active">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="2" y="10" width="8" height="10" rx="2" fill="currentColor"/><rect x="12" y="2" width="8" height="18" rx="2" fill="currentColor" opacity="0.6"/></svg>
      <span>总览</span>
    </a>
    <a href="assets.html" class="nav-item ">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="2" y="2" width="9" height="9" rx="2.5" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="2" width="7" height="9" rx="2.5" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="13" width="7" height="7" rx="2.5" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="13" width="7" height="7" rx="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>资产</span>
    </a>
    <a href="cashflow.html" class="nav-item ">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 11h14M4 7l4-4 4 4M18 15l-4 4-4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>收支</span>
    </a>
    <a href="diagnosis.html" class="nav-item ">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8.5" stroke="currentColor" stroke-width="1.5"/><path d="M11 6v5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>诊断</span>
    </a>
    <a href="goals.html" class="nav-item ">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8.5" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="11" r="4" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="11" r="1.5" fill="currentColor"/></svg>
      <span>目标</span>
    </a>
  </nav>
</div>

<script src="supabase.js"></script>
<script>
// 时钟
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
}
updateClock(); setInterval(updateClock, 10000);

async function render() {
  const user = await requireAuth();
  if (!user) return;

  document.getElementById('user-email').textContent = user.email;
  document.getElementById('logout-btn').addEventListener('click', signOut);

  const [assets, history] = await Promise.all([dbLoadAssets(), dbLoadHistory()]);
  const stats = calcStats(assets);
  const { byType, totalAssets, totalDebt, netWorth, debtRatio } = stats;

  // 净资产
  document.getElementById('nw-amount').textContent = fmt(netWorth);

  // 变化徽章
  if (history.length >= 2) {
    const prev = history[history.length - 2].netWorth;
    const diff = netWorth - prev;
    const pct  = prev > 0 ? ((diff / prev) * 100).toFixed(1) : 0;
    const badge = document.getElementById('nw-change-badge');
    badge.style.display = 'flex';
    badge.style.background = diff >= 0 ? 'rgba(92,240,176,0.12)' : 'rgba(255,107,107,0.1)';
    badge.style.color = diff >= 0 ? 'var(--ok)' : 'var(--warn)';
    badge.textContent = (diff >= 0 ? '↑ +' : '↓ ') + fmt(diff) + ' (' + pct + '%)';
  }
  if (parseFloat(debtRatio) > 0) {
    const db = document.getElementById('nw-debt-badge');
    db.style.display = 'flex';
    const high = parseFloat(debtRatio) > 40;
    db.style.background = high ? 'rgba(255,107,107,0.1)' : 'rgba(200,240,80,0.1)';
    db.style.color = high ? 'var(--warn)' : 'var(--accent)';
    db.textContent = '负债率 ' + debtRatio + '%';
  }

  // 健康分
  const dr = parseFloat(debtRatio);
  const debtScore = dr === 0 ? 100 : dr <= 30 ? 80 : dr <= 50 ? 55 : 30;
  const typeCount = ['cash','investment','fixed'].filter(t => byType[t] > 0).length;
  const diversityScore = typeCount * 33;
  const cashScore = totalAssets > 0 ? Math.min(100, (byType.cash / totalAssets) * 300) : 0;
  const score = Math.round(debtScore * 0.5 + diversityScore * 0.3 + cashScore * 0.2);
  document.getElementById('score-num').textContent = score;
  const circumference = 2 * Math.PI * 28;
  document.getElementById('score-circle').style.strokeDashoffset =
    (circumference * (1 - score / 100)).toFixed(1);

  // 快速统计
  const drEl = document.getElementById('debt-ratio');
  drEl.textContent = debtRatio + '%';
  drEl.style.color = parseFloat(debtRatio) > 50 ? 'var(--warn)' : parseFloat(debtRatio) > 30 ? 'var(--mid)' : 'var(--ok)';
  document.getElementById('asset-count').textContent = assets.length + ' 项';

  // 饼图
  renderPie(byType, totalAssets);

  // 趋势图
  renderTrend(history, netWorth);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = '';
}

function renderPie(byType, totalAssets) {
  const wrap = document.getElementById('pie-wrap');
  const types = [
    { key:'cash',       label:'现金存款', color:'#5cf0b0' },
    { key:'investment', label:'投资资产', color:'#60d0f0' },
    { key:'fixed',      label:'固定资产', color:'#c8f050' },
    { key:'debt',       label:'负债',     color:'#ff6b6b' },
  ].filter(t => byType[t.key] > 0);

  if (types.length === 0) {
    wrap.innerHTML = '<div style="color:var(--text-muted);font-size:13px">去资产页添加你的资产</div>';
    return;
  }

  const total = types.reduce((s, t) => s + byType[t.key], 0);
  const cx = 60, cy = 60, r = 46, ri = 28;
  let angle = -Math.PI / 2;
  let paths = '';

  types.forEach(t => {
    const slice = (byType[t.key] / total) * Math.PI * 2;
    const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    angle += slice - 0.03;
    const x2 = cx + r * Math.cos(angle), y2 = cy + r * Math.sin(angle);
    angle += 0.03;
    const xi1 = cx + ri * Math.cos(angle - slice + 0.03);
    const yi1 = cy + ri * Math.sin(angle - slice + 0.03);
    const xi2 = cx + ri * Math.cos(angle), yi2 = cy + ri * Math.sin(angle);
    const large = slice > Math.PI ? 1 : 0;
    paths += `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${large},1 ${x2.toFixed(1)},${y2.toFixed(1)} L${xi2.toFixed(1)},${yi2.toFixed(1)} A${ri},${ri} 0 ${large},0 ${xi1.toFixed(1)},${yi1.toFixed(1)} Z" fill="${t.color}"/>`;
  });

  const nw = Object.values(byType).reduce((a,b)=>a+b,0) - byType.debt*2;
  let legend = types.map(t => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${t.color}"></div>
      <span class="legend-name">${t.label}</span>
      <span class="legend-pct">${(byType[t.key]/total*100).toFixed(0)}%</span>
    </div>`).join('');

  wrap.innerHTML = `
    <svg width="120" height="120" viewBox="0 0 120 120">${paths}
      <text x="60" y="56" text-anchor="middle" fill="#f0f0f8" font-size="9" font-family="sans-serif" opacity="0.5">净资产</text>
      <text x="60" y="70" text-anchor="middle" fill="#f0f0f8" font-size="11" font-weight="bold" font-family="sans-serif">${fmt(nw)}</text>
    </svg>
    <div class="pie-legend">${legend}</div>`;
}

function renderTrend(history, netWorth) {
  const el = document.getElementById('trend-chart');
  if (history.length < 2) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:20px 0">添加资产并每月更新后显示趋势</div>';
    return;
  }

  const vals  = history.map(h => h.netWorth);
  const dates = history.map(h => h.date);
  const minV  = Math.min(...vals), maxV = Math.max(...vals);
  const range = maxV - minV || 1;
  const W = 327, H = 80, PAD = 4;

  document.getElementById('trend-latest').textContent = fmt(vals[vals.length - 1]);

  const pts = vals.map((v, i) => {
    const x = PAD + (i / (vals.length - 1)) * (W - PAD * 2);
    const y = PAD + (1 - (v - minV) / range) * (H - PAD * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');

  const lastPt = pts.split(' ').pop().split(',');
  const maxShow = 6;
  const step = Math.ceil(dates.length / maxShow);
  const labelPts = dates.map((d, i) => {
    if (i % step !== 0 && i !== dates.length - 1) return '';
    const x = PAD + (i / (vals.length - 1)) * (W - PAD * 2);
    return `<text x="${x.toFixed(1)}" y="${H + 14}" text-anchor="middle" fill="rgba(240,240,248,0.35)" font-size="9" font-family="sans-serif">${d}</text>`;
  }).join('');

  const firstPt = pts.split(' ')[0].split(',');
  const areaPath = `M${firstPt[0]},${H} L${pts.split(' ').map(p => p).join(' L')} L${lastPt[0]},${H} Z`;

  el.innerHTML = `<svg width="100%" viewBox="0 0 ${W} ${H + 20}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${[0.25,0.5,0.75].map(p=>`<line x1="${PAD}" y1="${(PAD+(1-p)*(H-PAD*2)).toFixed(1)}" x2="${W-PAD}" y2="${(PAD+(1-p)*(H-PAD*2)).toFixed(1)}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`).join('')}
    <path d="${areaPath}" fill="url(#tg)"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="4" fill="var(--accent)"/>
    ${labelPts}
  </svg>`;
}

render();
</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
