<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>财务健康 · 收支</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="base.css">
  <style>
    /* ── 月份切换 ── */
    .month-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px 16px;
    }
    .month-arrow {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-muted); font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }
    .month-arrow:hover  { border-color: var(--border2); color: var(--text); }
    .month-arrow:active { transform: scale(0.9); }
    .month-label { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }

    /* ── 英雄汇总卡 ── */
    .summary-hero {
      margin: 0 20px 14px;
      background: linear-gradient(150deg, #0e1a0a 0%, #0a1214 50%, #0e0e16 100%);
      border-radius: 26px; padding: 22px 24px 20px;
      border: 1px solid rgba(200,240,80,0.12);
      position: relative; overflow: hidden;
    }
    .summary-hero::before {
      content: ''; position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(200,240,80,0.06) 0%, transparent 65%);
      pointer-events: none;
    }
    .hero-row {
      display: grid; grid-template-columns: 1fr 1px 1fr 1px 1fr;
      gap: 0; align-items: center; margin-bottom: 18px;
    }
    .hero-divider { background: var(--border); height: 36px; }
    .hero-item { text-align: center; }
    .hero-item-label { font-size: 10px; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
    .hero-item-val   { font-size: 18px; font-weight: 700; font-family: var(--font-mono); letter-spacing: -0.5px; }

    /* 储蓄率进度条 */
    .savings-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .savings-label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.04em; }
    .savings-pct   { font-size: 13px; font-weight: 700; font-family: var(--font-mono); }
    .savings-bar-bg   { height: 6px; background: rgba(255,255,255,0.06); border-radius: 6px; overflow: hidden; }
    .savings-bar-fill { height: 100%; border-radius: 6px; transition: width 0.8s cubic-bezier(0.22,1,0.36,1); }
    .savings-hint { font-size: 10px; color: var(--text-muted); margin-top: 6px; opacity: 0.8; }

    /* ── 月度报告卡 ── */
    .report-card {
      margin: 0 20px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 22px; overflow: hidden;
    }
    .report-toggle {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; cursor: pointer; user-select: none;
    }
    .report-toggle-left { display: flex; align-items: center; gap: 8px; }
    .report-toggle-icon { font-size: 14px; }
    .report-toggle-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .report-toggle-arrow {
      font-size: 12px; color: var(--text-muted);
      transition: transform 0.25s; font-weight: 500;
    }
    .report-toggle-arrow.open { transform: rotate(90deg); }
    .report-body { padding: 0 18px 16px; }

    /* 本月 vs 上月 */
    .compare-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 18px; }
    .cmp-tile {
      background: var(--surface2); border-radius: 14px;
      padding: 12px 10px; text-align: center;
    }
    .cmp-label { font-size: 10px; color: var(--text-muted); margin-bottom: 5px; letter-spacing: 0.04em; }
    .cmp-val   { font-size: 14px; font-weight: 700; font-family: var(--font-mono); }
    .cmp-diff  { font-size: 10px; margin-top: 4px; font-weight: 500; }
    .cmp-diff.up   { color: var(--warn); }
    .cmp-diff.down { color: var(--ok); }
    .cmp-diff.neu  { color: var(--text-muted); }

    /* 分类条形图 */
    .cat-section-title {
      font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 12px; font-weight: 600;
    }
    .cat-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
    .cat-bar-icon { font-size: 15px; width: 22px; text-align: center; flex-shrink: 0; }
    .cat-bar-body { flex: 1; min-width: 0; }
    .cat-bar-top  { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
    .cat-bar-name { font-size: 11px; color: var(--text); font-weight: 500; }
    .cat-bar-amt  { font-size: 11px; font-weight: 700; font-family: var(--font-mono); color: var(--warn); }
    .cat-bar-bg   { height: 4px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
    .cat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(0.22,1,0.36,1); }
    .cat-bar-cmp  { font-size: 10px; margin-top: 3px; }

    /* ── 收支列表 ── */
    .cf-section { padding: 0 20px; margin-bottom: 18px; }
    .cf-section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .cf-section-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
    }
    .cf-section-dot { width: 6px; height: 6px; border-radius: 50%; }
    .cf-section-total { font-size: 13px; font-weight: 700; font-family: var(--font-mono); }

    .cf-empty {
      text-align: center; padding: 22px 0; color: var(--text-muted);
      font-size: 12px; line-height: 1.8;
    }
    .cf-empty-icon { font-size: 26px; margin-bottom: 6px; }

    .add-row-btn {
      height: 44px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; cursor: pointer;
      margin-top: 4px; transition: opacity 0.15s, transform 0.12s;
      letter-spacing: 0.02em;
    }
    .add-row-btn:active { transform: scale(0.97); opacity: 0.8; }

    /* ── 弹窗 ── */
    .type-switch {
      display: flex; background: rgba(255,255,255,0.05);
      border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 18px;
    }
    .ts-btn {
      flex: 1; height: 38px; border-radius: 10px; border: none;
      font-size: 14px; font-weight: 600; font-family: var(--font);
      cursor: pointer; transition: all 0.2s;
      color: var(--text-muted); background: transparent;
    }
    .ts-btn.active-income  { background: var(--ok-dim);   color: var(--ok); }
    .ts-btn.active-expense { background: var(--warn-dim); color: var(--warn); }

    .cat-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 18px; }
    .cat-btn  {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 12px; padding: 10px 4px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; transition: all 0.15s;
    }
    .cat-btn.selected { border-color: var(--accent); background: var(--accent-dim); }
    .cat-btn:active   { transform: scale(0.92); }
    .cat-btn-icon  { font-size: 20px; }
    .cat-btn-label { font-size: 10px; color: var(--text-muted); }

    .month-select {
      width: 100%; height: 50px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 0 16px;
      font-size: 15px; font-family: var(--font);
      color: var(--text); outline: none;
      transition: border-color 0.15s; appearance: none;
    }
    .month-select:focus { border-color: var(--accent); }

    .save-btn-income  { background: var(--ok);    color: #071a10; }
    .save-btn-expense { background: var(--accent); color: #0a0a0e; }
  </style>

</head>

<script>
let currentMonth = '';
let modalType    = 'income';
let selectedCat  = '';
let allRows      = [];

// 时钟
function updateClock() {
  const n = new Date();
  document.getElementById('clock').textContent =
    n.getHours() + ':' + String(n.getMinutes()).padStart(2,'0');
}
updateClock(); setInterval(updateClock, 10000);

function allMonths() {
  const months = [];
  const now = new Date();
  for (let i=11; i>=0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  return months;
}
function fmtMonth(ym) {
  if (!ym) return '—';
  const [y,m] = ym.split('-');
  return `${y}年 ${parseInt(m)}月`;
}

// ── 主渲染 ────────────────────────────────────────────
async function render() {
  const user = await requireAuth();
  if (!user) return;

  if (!currentMonth) {
    const now = new Date();
    currentMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  }

  allRows = await dbLoadCashflow();
  const cf = calcCashflow(allRows, currentMonth);
  const months = allMonths();

  document.getElementById('month-display').textContent = fmtMonth(currentMonth);
  document.getElementById('prev-month').style.opacity = months.indexOf(currentMonth) > 0 ? '1':'0.3';
  document.getElementById('next-month').style.opacity = months.indexOf(currentMonth) < months.length-1 ? '1':'0.3';

  // 汇总数值
  document.getElementById('sum-income').textContent  = fmt(cf.income);
  document.getElementById('sum-expense').textContent = fmt(cf.expense);
  const savEl = document.getElementById('sum-saving');
  savEl.textContent  = fmt(cf.saving);
  savEl.style.color  = cf.saving >= 0 ? 'var(--ok)' : 'var(--warn)';

  // 储蓄率
  const sr = parseInt(cf.savRate);
  const pctEl = document.getElementById('sav-pct');
  pctEl.textContent = cf.income > 0 ? sr + '%' : '—';
  const barColor = sr >= 20 ? 'var(--ok)' : sr >= 10 ? 'var(--mid)' : 'var(--warn)';
  pctEl.style.color = barColor;
  const barEl = document.getElementById('sav-bar');
  barEl.style.width      = Math.max(0, Math.min(100, sr)) + '%';
  barEl.style.background = barColor;
  document.getElementById('sav-hint').textContent =
    cf.income === 0 ? '本月还没有收入记录' :
    sr >= 20 ? `✅ 储蓄率达标（≥20%）` :
    sr >= 10 ? `⚠️ 距目标还差 ${20-sr}%` :
               `🔴 储蓄率偏低，注意控制支出`;

  renderReport(allRows, currentMonth);
  renderGroups(cf.rows);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = '';
}

// ── 月度报告 ──────────────────────────────────────────
function renderReport(allRows, curMonth) {
  const [y, m] = curMonth.split('-').map(Number);
  const prevDate  = new Date(y, m - 2, 1);
  const prevMonth = `${prevDate.getFullYear()}-${String(prevDate.getMonth()+1).padStart(2,'0')}`;
  const cur  = calcCashflow(allRows, curMonth);
  const prev = calcCashflow(allRows, prevMonth);

  // 对比格
  function diffHtml(curVal, prevVal, reverse) {
    if (prevVal === 0) return '<div class="cmp-diff neu">—</div>';
    const d = curVal - prevVal;
    const pct = Math.abs(Math.round(d / prevVal * 100));
    const isGood = reverse ? d < 0 : d > 0;
    const cls  = d === 0 ? 'neu' : (isGood ? 'down' : 'up');
    const sign = d >= 0 ? '▲' : '▼';
    return `<div class="cmp-diff ${cls}">${sign} ${pct}%</div>`;
  }
  document.getElementById('compare-grid').innerHTML = `
    <div class="cmp-tile">
      <div class="cmp-label">收入</div>
      <div class="cmp-val" style="color:var(--ok)">${fmt(cur.income)}</div>
      ${diffHtml(cur.income, prev.income, false)}
    </div>
    <div class="cmp-tile">
      <div class="cmp-label">支出</div>
      <div class="cmp-val" style="color:var(--warn)">${fmt(cur.expense)}</div>
      ${diffHtml(cur.expense, prev.expense, true)}
    </div>
    <div class="cmp-tile">
      <div class="cmp-label">结余</div>
      <div class="cmp-val" style="color:${cur.saving>=0?'var(--accent)':'var(--warn)'}">${fmt(cur.saving)}</div>
      ${diffHtml(cur.saving, prev.saving, false)}
    </div>`;

  // 分类条形图
  const expRows  = allRows.filter(r => r.type==='expense' && r.date_month===curMonth);
  const prevExp  = allRows.filter(r => r.type==='expense' && r.date_month===prevMonth);
  const catMap   = {};
  expRows.forEach(r => {
    if (!catMap[r.category]) catMap[r.category] = { icon: r.icon, amount: 0 };
    catMap[r.category].amount += Number(r.amount);
  });
  const prevCatMap = {};
  prevExp.forEach(r => {
    if (!prevCatMap[r.category]) prevCatMap[r.category] = 0;
    prevCatMap[r.category] += Number(r.amount);
  });

  const cats = Object.entries(catMap).sort((a,b) => b[1].amount - a[1].amount);
  const maxAmt = cats.length > 0 ? cats[0][1].amount : 1;
  const catNames = {
    food:'餐饮', transport:'交通', shopping:'购物',
    medical:'医疗', entertain:'娱乐', invest:'投资', salary:'工资',
    gift:'红包', other:'其他', rent:'房租', utility:'水电'
  };

  const barsEl = document.getElementById('cat-bars');
  if (!cats.length) {
    barsEl.innerHTML = '<div style="text-align:center;padding:12px 0;font-size:12px;color:var(--text-muted)">本月暂无支出记录</div>';
    return;
  }
  barsEl.innerHTML = cats.map(([catId, info]) => {
    const pct     = Math.round(info.amount / maxAmt * 100);
    const prevAmt = prevCatMap[catId] || 0;
    const name    = catNames[catId] || catId;
    let cmpHtml   = '';
    if (prevAmt > 0) {
      const d    = info.amount - prevAmt;
      const pctD = Math.abs(Math.round(d / prevAmt * 100));
      const cls  = d > 0 ? 'up' : 'down';
      const sign = d > 0 ? '▲' : '▼';
      cmpHtml = `<div class="cat-bar-cmp cmp-diff ${cls}">${sign} ${pctD}% vs 上月</div>`;
    }
    return `
      <div class="cat-bar-row">
        <div class="cat-bar-icon">${info.icon}</div>
        <div class="cat-bar-body">
          <div class="cat-bar-top">
            <span class="cat-bar-name">${name}</span>
            <span class="cat-bar-amt">${fmt(info.amount)}</span>
          </div>
          <div class="cat-bar-bg">
            <div class="cat-bar-fill" style="width:${pct}%;background:var(--warn);opacity:0.8"></div>
          </div>
          ${cmpHtml}
        </div>
      </div>`;
  }).join('');
}

// ── 收支列表 ──────────────────────────────────────────
function renderGroups(rows) {
  const listEl = document.getElementById('cf-lists');
  listEl.innerHTML = '';
  const incomes  = rows.filter(r => r.type === 'income');
  const expenses = rows.filter(r => r.type === 'expense');
  renderSection(listEl, 'income',  incomes,  '收入', 'var(--ok)');
  renderSection(listEl, 'expense', expenses, '支出', 'var(--warn)');
}

function renderSection(container, type, rows, label, color) {
  const isIncome = type === 'income';
  const total = rows.reduce((s, r) => s + Number(r.amount), 0);
  const section = document.createElement('div');
  section.className = 'cf-section';

  section.innerHTML = `
    <div class="cf-section-header">
      <div class="cf-section-label">
        <div class="cf-section-dot" style="background:${color}"></div>
        ${label}
      </div>
      <span class="cf-section-total" style="color:${color}">${rows.length > 0 ? fmt(total) : ''}</span>
    </div>`;

  if (!rows.length) {
    section.innerHTML += `<div class="cf-empty"><div class="cf-empty-icon">${isIncome ? '💳' : '🧾'}</div>本月暂无${label}记录</div>`;
  } else {
    rows.forEach(row => {
      const cat   = getCfCat(type, row.category);
      const iconBg = isIncome ? 'rgba(92,240,176,0.1)' : 'rgba(255,107,107,0.08)';
      const el = document.createElement('div');
      el.className = 'cf-entry';
      el.innerHTML = `
        <div class="cf-icon" style="background:${iconBg}">${row.icon || cat.icon}</div>
        <div class="cf-info">
          <div class="cf-name">${row.name || cat.label}</div>
          <div class="cf-cat">${cat.label}</div>
        </div>
        <div class="cf-amt" style="color:${color}">${isIncome ? '+' : '-'}${fmtFull(row.amount)}</div>
        <button class="cf-del" data-id="${row.id}">✕</button>`;
      section.appendChild(el);
    });
  }

  // 添加按钮
  const addBtn = document.createElement('div');
  addBtn.className = 'add-row-btn';
  addBtn.style.cssText = `border:1.5px dashed ${isIncome?'rgba(92,240,176,0.3)':'rgba(200,240,80,0.3)'};background:${isIncome?'var(--ok-dim)':'var(--accent-dim)'};color:${isIncome?'var(--ok)':'var(--accent)'};`;
  addBtn.textContent = `＋ 记${isIncome ? '一笔收入' : '一笔支出'}`;
  addBtn.addEventListener('click', () => openModal(type));
  section.appendChild(addBtn);
  container.appendChild(section);

  section.querySelectorAll('.cf-del').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      if (!confirm('确认删除？')) return;
      btn.textContent = '…';
      await dbDeleteCashflow(btn.dataset.id);
      await render();
    });
  });
}

// 月份切换
document.getElementById('prev-month').addEventListener('click', () => {
  const months = allMonths();
  const idx = months.indexOf(currentMonth);
  if (idx > 0) { currentMonth = months[idx-1]; render(); }
});
document.getElementById('next-month').addEventListener('click', () => {
  const months = allMonths();
  const idx = months.indexOf(currentMonth);
  if (idx < months.length-1) { currentMonth = months[idx+1]; render(); }
});

// 报告折叠
document.getElementById('report-toggle').addEventListener('click', () => {
  const body  = document.getElementById('report-body');
  const arrow = document.getElementById('report-arrow');
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : '';
  arrow.classList.toggle('open', !isOpen);
});

// ── 弹窗 ──────────────────────────────────────────────
function openModal(type) {
  modalType = type;
  selectedCat = type==='income' ? CF_INCOME_CATS[0].id : CF_EXPENSE_CATS[0].id;
  document.getElementById('input-name').value   = '';
  document.getElementById('input-amount').value = '';
  const incBtn = document.getElementById('ts-income');
  const expBtn = document.getElementById('ts-expense');
  incBtn.className = 'ts-btn' + (type==='income' ? ' active-income' : '');
  expBtn.className = 'ts-btn' + (type==='expense'? ' active-expense': '');
  const sel = document.getElementById('input-month');
  sel.innerHTML = '';
  allMonths().reverse().forEach(m => {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = fmtMonth(m);
    if (m === currentMonth) opt.selected = true;
    sel.appendChild(opt);
  });
  const saveBtn = document.getElementById('save-btn');
  saveBtn.textContent = type==='income' ? '保存收入' : '保存支出';
  saveBtn.className   = 'save-btn ' + (type==='income' ? 'save-btn-income' : 'save-btn-expense');
  renderCatGrid(type);
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('input-amount').focus(), 350);
}

function renderCatGrid(type) {
  const grid = document.getElementById('cat-grid');
  grid.innerHTML = '';
  const cats = type==='income' ? CF_INCOME_CATS : CF_EXPENSE_CATS;
  cats.forEach((cat, i) => {
    const el = document.createElement('div');
    el.className = 'cat-btn' + (i===0 ? ' selected' : '');
    el.innerHTML = `<span class="cat-btn-icon">${cat.icon}</span><span class="cat-btn-label">${cat.label}</span>`;
    el.addEventListener('click', () => {
      selectedCat = cat.id;
      grid.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
    });
    grid.appendChild(el);
  });
}

['ts-income','ts-expense'].forEach(id => {
  document.getElementById(id).addEventListener('click', () => {
    const t = id==='ts-income' ? 'income' : 'expense';
    if (t === modalType) return;
    modalType = t;
    document.getElementById('ts-income').className  = 'ts-btn' + (t==='income'  ? ' active-income' : '');
    document.getElementById('ts-expense').className = 'ts-btn' + (t==='expense' ? ' active-expense': '');
    const saveBtn = document.getElementById('save-btn');
    saveBtn.textContent = t==='income' ? '保存收入' : '保存支出';
    saveBtn.className   = 'save-btn ' + (t==='income' ? 'save-btn-income' : 'save-btn-expense');
    selectedCat = t==='income' ? CF_INCOME_CATS[0].id : CF_EXPENSE_CATS[0].id;
    renderCatGrid(t);
  });
});

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') document.getElementById('modal').classList.remove('open');
});

document.getElementById('save-btn').addEventListener('click', async () => {
  const name   = document.getElementById('input-name').value.trim();
  const amount = parseFloat(document.getElementById('input-amount').value);
  const month  = document.getElementById('input-month').value;
  if (!amount || amount <= 0) { alert('请填写正确的金额'); return; }
  const cat = getCfCat(modalType, selectedCat);
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = '保存中…';
  await dbAddCashflow({ type:modalType, category:selectedCat, name:name||cat.label, amount, date:month, icon:cat.icon });
  btn.disabled = false;
  btn.textContent   = modalType==='income' ? '保存收入' : '保存支出';
  document.getElementById('modal').classList.remove('open');
  await render();
});

render();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  }
</script>
</body>
