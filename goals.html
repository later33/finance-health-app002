<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>财务健康 · 目标</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3"></script>
  <link rel="stylesheet" href="base.css">
  <style>
    /* ── 顶部汇总条 ── */
    .goals-stats {
      display: flex; gap: 10px;
      padding: 0 20px 16px;
    }
    .gs-pill {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 12px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .gs-pill-icon { font-size: 20px; }
    .gs-pill-body {}
    .gs-pill-val   { font-size: 20px; font-weight: 800; font-family: var(--font-mono); }
    .gs-pill-label { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

    /* ── 目标卡片 ── */
    .goals-list { padding: 0 20px; display: flex; flex-direction: column; gap: 14px; }

    .goal-card {
      background: var(--surface); border-radius: 24px;
      border: 1px solid var(--border);
      overflow: hidden; position: relative;
      transition: border-color 0.2s, transform 0.15s;
    }
    .goal-card:active { transform: scale(0.99); }
    .goal-card.done   { border-color: rgba(92,240,176,0.35); }
    .goal-card.late   { border-color: rgba(255,107,107,0.35); }
    .goal-card.active { border-color: rgba(200,240,80,0.25); }

    /* 顶部彩条 */
    .goal-card-bar {
      height: 3px; width: 100%;
    }
    .goal-card-bar.done   { background: var(--ok); }
    .goal-card-bar.late   { background: var(--warn); }
    .goal-card-bar.active { background: linear-gradient(90deg, var(--accent), var(--ok)); }

    /* 内容区 */
    .gc-inner { padding: 18px 18px 16px; }

    /* 顶部行：emoji + 信息 + 环 */
    .gc-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .gc-emoji-wrap {
      width: 46px; height: 46px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
    }
    .gc-main { flex: 1; min-width: 0; }
    .gc-name     { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.2px; }
    .gc-sub      { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

    /* 进度环 */
    .gc-ring-wrap { width: 60px; height: 60px; position: relative; flex-shrink: 0; }
    .gc-ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .gc-ring-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; line-height: 1;
    }
    .gc-ring-pct  { font-size: 14px; font-weight: 800; font-family: var(--font-mono); }
    .gc-ring-sub  { font-size: 8px; color: var(--text-muted); margin-top: 1px; }

    /* 金额行 */
    .gc-amounts {
      display: flex; justify-content: space-between;
      align-items: baseline; margin-bottom: 10px;
    }
    .gc-current { font-size: 22px; font-weight: 800; font-family: var(--font-mono); color: var(--text); letter-spacing: -0.5px; }
    .gc-target  { font-size: 12px; color: var(--text-muted); }

    /* 进度条 */
    .gc-bar-bg {
      height: 8px; background: rgba(255,255,255,0.06);
      border-radius: 8px; margin-bottom: 12px; overflow: hidden;
      position: relative;
    }
    .gc-bar-fill {
      height: 100%; border-radius: 8px;
      transition: width 1.2s cubic-bezier(0.22,1,0.36,1);
      position: relative;
    }
    .gc-bar-fill.done   { background: var(--ok); }
    .gc-bar-fill.active { background: linear-gradient(90deg, var(--accent), var(--ok)); }
    .gc-bar-fill.late   { background: var(--warn); }
    .gc-bar-fill::after {
      content: ''; position: absolute; top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      animation: shimmer 2.4s 0.8s infinite;
    }

    /* 底部信息行 */
    .gc-footer { display: flex; justify-content: space-between; align-items: center; }
    .gc-meta {
      display: flex; flex-direction: column; gap: 2px;
    }
    .gc-meta-item { font-size: 11px; color: var(--text-muted); }
    .gc-meta-item strong { color: var(--text); font-weight: 600; }
    .gc-actions { display: flex; gap: 6px; }
    .gc-btn {
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(255,255,255,0.05); border: none;
      color: var(--text-muted); font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s;
    }
    .gc-btn:hover { color: var(--accent); background: var(--accent-dim); }
    .gc-btn.del:hover { color: var(--warn); background: var(--warn-dim); }
    .gc-btn:active { transform: scale(0.88); }

    /* 达成徽章 */
    .gc-done-banner {
      background: linear-gradient(135deg, rgba(92,240,176,0.08), rgba(200,240,80,0.06));
      border: 1px solid rgba(92,240,176,0.2);
      border-radius: 12px; padding: 10px 14px;
      text-align: center; font-size: 13px; color: var(--ok);
      font-weight: 600; margin-bottom: 12px;
    }

    /* ── 空状态 ── */
    .empty-goals {
      text-align: center; padding: 52px 24px;
      color: var(--text-muted); font-size: 13px; line-height: 1.8;
    }
    .empty-goals .ei { font-size: 52px; margin-bottom: 16px; }
    .empty-goals p { max-width: 240px; margin: 0 auto; }

    /* ── FAB ── */
    .add-fab {
      position: fixed; bottom: 96px;
      right: calc(50% - 375px/2 + 20px);
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--accent); color: #0a0a0e;
      border: none; font-size: 24px; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(200,240,80,0.35), 0 0 0 0 rgba(200,240,80,0.4);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
      z-index: 50;
      animation: fabPulse 3s ease-in-out infinite;
    }
    @keyframes fabPulse {
      0%,100% { box-shadow: 0 4px 20px rgba(200,240,80,0.35); }
      50%      { box-shadow: 0 4px 28px rgba(200,240,80,0.55), 0 0 0 6px rgba(200,240,80,0.08); }
    }
    .add-fab:active { transform: scale(0.9); animation: none; box-shadow: 0 2px 10px rgba(200,240,80,0.2); }

    /* ── 弹窗内 emoji 选择 ── */
    .emoji-row {
      display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .emoji-opt {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--surface); border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; cursor: pointer; transition: all 0.15s;
    }
    .emoji-opt.selected { border-color: var(--accent); background: var(--accent-dim); }
    .emoji-opt:active   { transform: scale(0.88); }
  </style>

  <meta name="theme-color" content="#0a0a0e">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-title" content="财务健康">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>

<script src="js/finance.js"></script>
<script src="supabase.js"></script>
<script>
let selectedEmoji = '🎯';
let editId = null;

function updateClock() {
  const n = new Date();
  document.getElementById('clock').textContent =
    n.getHours() + ':' + String(n.getMinutes()).padStart(2,'0');
}
updateClock(); setInterval(updateClock, 10000);

// CRUD
async function loadGoals() {
  const { data, error } = await sb.from('goals').select('*').order('created_at');
  if (error) { console.error(error); return []; }
  return data;
}
async function saveGoal(goal) {
  const user = await getUser();
  if (editId) {
    await sb.from('goals').update({
      emoji: goal.emoji, name: goal.name,
      target_amount: goal.target_amount,
      deadline: goal.deadline || null,
      asset_type: goal.asset_type,
    }).eq('id', editId);
  } else {
    await sb.from('goals').insert({
      user_id: user.id,
      emoji: goal.emoji, name: goal.name,
      target_amount: goal.target_amount,
      deadline: goal.deadline || null,
      asset_type: goal.asset_type,
    });
  }
}
async function deleteGoal(id) {
  await sb.from('goals').delete().eq('id', id);
}

function getCurrentAmount(assets, assetType) {
  const stats = calcStats(assets);
  if (assetType === 'all')        return stats.netWorth;
  if (assetType === 'cash')       return stats.byType.cash;
  if (assetType === 'investment') return stats.byType.investment;
  if (assetType === 'fixed')      return stats.byType.fixed;
  return 0;
}

function fmtDeadline(deadline) {
  if (!deadline) return '';
  const now  = new Date();
  const dead = new Date(deadline + '-01');
  const diffMs   = dead - now;
  const diffDays = Math.ceil(diffMs / (1000*60*60*24));
  const [y, m]   = deadline.split('-');
  const label    = `${y}年${parseInt(m)}月`;
  if (diffDays < 0)  return `${label} · 已逾期`;
  if (diffDays < 30) return `${label} · 还剩 ${diffDays} 天`;
  return `${label} · 还剩 ${Math.ceil(diffDays/30)} 个月`;
}
function isLate(deadline) {
  if (!deadline) return false;
  return new Date(deadline + '-01') < new Date();
}

// 生成进度环 SVG 路径
function ringPath(pct, r, stroke, trackColor, fillColor) {
  const c = 2 * Math.PI * r;
  const offset = c * (1 - Math.min(1, pct/100));
  return `
    <circle fill="none" stroke="${trackColor}" stroke-width="${stroke}" cx="${r+stroke/2+1}" cy="${r+stroke/2+1}" r="${r}"/>
    <circle fill="none" stroke="${fillColor}" stroke-width="${stroke}" stroke-linecap="round"
      cx="${r+stroke/2+1}" cy="${r+stroke/2+1}" r="${r}"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
      style="transition:stroke-dashoffset 1.2s cubic-bezier(0.22,1,0.36,1)"/>`;
}

// ── 主渲染 ───────────────────────────────────────────────
async function render() {
  const user = await requireAuth();
  if (!user) return;

  const [goals, assets] = await Promise.all([loadGoals(), dbLoadAssets()]);
  const doneGoals   = goals.filter(g => getCurrentAmount(assets, g.asset_type) >= g.target_amount);
  const activeGoals = goals.filter(g => getCurrentAmount(assets, g.asset_type) < g.target_amount);

  // 汇总条
  if (goals.length > 0) {
    document.getElementById('goals-stats').style.display = '';
    document.getElementById('gs-active').textContent = activeGoals.length;
    document.getElementById('gs-done').textContent   = doneGoals.length;
    const totalTarget = goals.reduce((s,g) => s + Number(g.target_amount), 0);
    document.getElementById('gs-total').textContent  = fmt(totalTarget);
  }

  const listEl = document.getElementById('goals-list');
  listEl.innerHTML = '';

  if (!goals.length) {
    listEl.innerHTML = `
      <div class="empty-goals">
        <div class="ei">🎯</div>
        <p>还没有财务目标，<br>点击右下角 ＋ 创建第一个目标</p>
      </div>`;
  } else {
    goals.forEach((goal, idx) => {
      const current = getCurrentAmount(assets, goal.asset_type);
      const pct     = Math.min(100, (current / goal.target_amount) * 100);
      const remain  = goal.target_amount - current;
      const done    = current >= goal.target_amount;
      const late    = !done && isLate(goal.deadline);
      const state   = done ? 'done' : late ? 'late' : 'active';

      // 进度环颜色
      const ringColor = done ? 'var(--ok)' : late ? 'var(--warn)' : 'var(--accent)';
      const ringTrack = 'rgba(255,255,255,0.06)';
      const r = 22, sw = 4;
      const size = r*2 + sw + 2;
      const svgSize = size;

      // emoji 背景色
      const emojiBg = done ? 'rgba(92,240,176,0.1)' : late ? 'rgba(255,107,107,0.08)' : 'rgba(200,240,80,0.08)';

      // 资产类型标签
      const assetLabels = {all:'净资产', cash:'现金存款', investment:'投资资产', fixed:'固定资产'};

      const card = document.createElement('div');
      card.className = `goal-card ${state}`;
      card.style.animationDelay = `${idx * 0.06}s`;
      card.innerHTML = `
        <div class="goal-card-bar ${state}"></div>
        <div class="gc-inner">
          ${done ? `<div class="gc-done-banner">🎉 恭喜达成目标！</div>` : ''}
          <div class="gc-top">
            <div class="gc-emoji-wrap" style="background:${emojiBg}">${goal.emoji}</div>
            <div class="gc-main">
              <div class="gc-name">${goal.name}</div>
              <div class="gc-sub">${assetLabels[goal.asset_type] || '净资产'}${goal.deadline ? ' · ' + fmtDeadline(goal.deadline) : ''}</div>
            </div>
            <div class="gc-ring-wrap">
              <svg width="${svgSize}" height="${svgSize}" viewBox="0 0 ${svgSize} ${svgSize}">
                ${ringPath(pct, r, sw, ringTrack, ringColor)}
              </svg>
              <div class="gc-ring-center">
                <span class="gc-ring-pct" style="color:${ringColor}">${pct.toFixed(0)}%</span>
              </div>
            </div>
          </div>

          <div class="gc-amounts">
            <span class="gc-current">${fmt(current)}</span>
            <span class="gc-target">目标 ${fmt(goal.target_amount)}</span>
          </div>

          <div class="gc-bar-bg">
            <div class="gc-bar-fill ${state}" style="width:${pct}%"></div>
          </div>

          <div class="gc-footer">
            <div class="gc-meta">
              ${done
                ? `<div class="gc-meta-item" style="color:var(--ok);font-weight:600">已超额 ${fmt(current - goal.target_amount)}</div>`
                : `<div class="gc-meta-item">还差 <strong>${fmt(remain)}</strong></div>`
              }
            </div>
            <div class="gc-actions">
              <button class="gc-btn edit" data-id="${goal.id}" title="编辑">✏️</button>
              <button class="gc-btn del"  data-id="${goal.id}" title="删除">🗑️</button>
            </div>
          </div>
        </div>`;
      listEl.appendChild(card);
    });

    listEl.querySelectorAll('.gc-btn.edit').forEach(btn => {
      btn.addEventListener('click', () => {
        const goal = goals.find(g => g.id === btn.dataset.id);
        openModal(goal);
      });
    });
    listEl.querySelectorAll('.gc-btn.del').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('确认删除这个目标？')) return;
        await deleteGoal(btn.dataset.id);
        await render();
      });
    });
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = '';
}

// ── 弹窗 ─────────────────────────────────────────────────
function openModal(goal = null) {
  editId = goal ? goal.id : null;
  document.getElementById('modal-title').textContent   = goal ? '编辑目标' : '新建目标';
  document.getElementById('input-name').value          = goal?.name || '';
  document.getElementById('input-target').value        = goal?.target_amount || '';
  document.getElementById('input-deadline').value      = goal?.deadline || '';
  document.getElementById('input-asset-type').value    = goal?.asset_type || 'all';
  document.getElementById('save-btn').textContent      = goal ? '保存修改' : '创建目标';

  selectedEmoji = goal?.emoji || '🎯';
  document.querySelectorAll('.emoji-opt').forEach(el => {
    el.classList.toggle('selected', el.dataset.emoji === selectedEmoji);
  });

  document.getElementById('modal').classList.add('open');
}

document.getElementById('open-modal').addEventListener('click', () => openModal());
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') document.getElementById('modal').classList.remove('open');
});
document.querySelectorAll('.emoji-opt').forEach(el => {
  el.addEventListener('click', () => {
    selectedEmoji = el.dataset.emoji;
    document.querySelectorAll('.emoji-opt').forEach(e => e.classList.remove('selected'));
    el.classList.add('selected');
  });
});

document.getElementById('save-btn').addEventListener('click', async () => {
  const name     = document.getElementById('input-name').value.trim();
  const target   = parseFloat(document.getElementById('input-target').value);
  const deadline = document.getElementById('input-deadline').value;
  const assetType = document.getElementById('input-asset-type').value;
  if (!name)           { alert('请填写目标名称'); return; }
  if (!target || target<=0) { alert('请填写目标金额'); return; }
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = '保存中…';
  await saveGoal({ emoji: selectedEmoji, name, target_amount: target, deadline, asset_type: assetType });
  btn.disabled = false;
  document.getElementById('modal').classList.remove('open');
  await render();
});

render();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  }
</script>
</body>
</html>
