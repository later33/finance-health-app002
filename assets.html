<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>财务健康 · 资产</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="base.css">
  <style>
    .net-bar { display:flex;justify-content:space-between;align-items:center;padding:0 24px 16px; }
    .net-bar-val { font-size:22px;font-weight:800; }
    .add-fab {
      height:44px;padding:0 20px;border-radius:22px;border:none;
      background:var(--accent);color:#0f0f13;font-size:14px;font-weight:700;
      font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;
    }
    .asset-group { padding:0 24px;margin-bottom:20px; }
    .asset-card {
      background:var(--surface);border-radius:16px;
      padding:14px 14px;margin-bottom:8px;
      border:1px solid var(--border);
      display:flex;align-items:center;gap:12px;
      cursor:pointer;transition:border-color 0.15s,transform 0.12s;
    }
    .asset-card:active { transform:scale(0.98); }
    .asset-card:hover  { border-color:rgba(200,240,80,0.3); }
    .asset-icon {
      width:42px;height:42px;border-radius:14px;
      display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;
    }
    .asset-info { flex:1; }
    .asset-name { font-size:14px;font-weight:500;color:var(--text); }
    .asset-note { font-size:11px;color:var(--text-muted);margin-top:2px; }
    .asset-amt  { font-size:15px;font-weight:700; }
    .del-btn {
      width:28px;height:28px;border-radius:50%;background:var(--warn-dim);
      border:none;color:var(--warn);font-size:12px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      opacity:0;transition:opacity 0.15s;flex-shrink:0;
    }
    .asset-card:hover .del-btn { opacity:1; }
    @media (hover:none) { .del-btn { opacity:1; } }

    /* 弹窗 */
    .modal-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:flex-end;justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { width:375px;background:var(--surface2);border-radius:28px 28px 0 0;padding:0 24px 40px;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);max-height:90vh;overflow-y:auto; }
    .modal-overlay.open .modal { transform:translateY(0); }
    .modal-handle { width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 18px; }
    .modal-title  { font-size:18px;font-weight:700;color:var(--text);margin-bottom:18px; }

    .type-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px; }
    .type-btn {
      background:var(--surface);border:1.5px solid var(--border);
      border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;
      align-items:center;gap:5px;cursor:pointer;transition:all 0.15s;
    }
    .type-btn.selected { border-color:var(--accent);background:var(--accent-dim); }
    .type-btn-icon  { font-size:22px; }
    .type-btn-label { font-size:10px;color:var(--text-muted); }

    .icon-grid { display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px; }
    .icon-btn {
      width:44px;height:44px;border-radius:12px;background:var(--surface);
      border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;
      font-size:20px;cursor:pointer;transition:all 0.15s;
    }
    .icon-btn.selected { border-color:var(--accent);background:var(--accent-dim); }

    .field { margin-bottom:14px; }
    .field label { display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px; }
    .field input {
      width:100%;height:48px;background:var(--surface);border:1.5px solid var(--border);
      border-radius:14px;padding:0 16px;font-size:15px;font-family:inherit;
      color:var(--text);outline:none;transition:border-color 0.15s;
    }
    .field input:focus { border-color:var(--accent); }
    .field input::placeholder { color:var(--text-muted); }
    .amount-wrap { position:relative; }
    .amount-prefix { position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted); }
    .amount-wrap input { padding-left:28px; }
    .save-btn {
      width:100%;height:52px;border:none;border-radius:16px;
      background:var(--accent);color:#0f0f13;
      font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px;
    }
    .save-btn:disabled { opacity:0.5;cursor:not-allowed; }

    .loading-screen { position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:200; }
    .spin { width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-screen p { font-size:13px;color:var(--text-muted); }

    /* 编辑弹窗 */
    .edit-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:150;align-items:flex-end;justify-content:center; }
    .edit-overlay.open { display:flex; }
    .edit-sheet { width:375px;background:var(--surface2);border-radius:28px 28px 0 0;padding:0 24px 44px;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1); }
    .edit-overlay.open .edit-sheet { transform:translateY(0); }
    .edit-handle { width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 16px; }
    .edit-asset-info { display:flex;align-items:center;gap:12px;padding:4px 0 18px;border-bottom:1px solid var(--border);margin-bottom:18px; }
    .edit-asset-icon { width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px; }
    .edit-asset-name { font-size:16px;font-weight:700;color:var(--text); }
    .edit-asset-type { font-size:11px;color:var(--text-muted);margin-top:2px; }
    .edit-label { font-size:12px;color:var(--text-muted);margin-bottom:6px; }
    .edit-amount-wrap { position:relative;margin-bottom:16px; }
    .edit-prefix { position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:18px; }
    .edit-amount-input {
      width:100%;height:58px;background:var(--surface);border:2px solid var(--accent);
      border-radius:16px;padding:0 16px 0 30px;font-size:22px;font-weight:800;
      font-family:inherit;color:var(--text);outline:none;
    }
    .edit-quick-row { display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap; }
    .edit-quick-btn {
      height:32px;padding:0 12px;border-radius:10px;
      background:var(--surface);border:1px solid var(--border);
      color:var(--text-muted);font-size:12px;font-family:inherit;cursor:pointer;
      transition:all 0.15s;
    }
    .edit-quick-btn:active { background:var(--accent-dim);color:var(--accent);border-color:var(--accent); }
    .edit-save-btn {
      width:100%;height:52px;border:none;border-radius:16px;
      background:var(--accent);color:#0f0f13;font-size:16px;font-weight:700;
      font-family:inherit;cursor:pointer;transition:transform 0.12s,opacity 0.12s;
    }
    .edit-save-btn:active { transform:scale(0.97); }
    .edit-save-btn:disabled { opacity:0.5;cursor:not-allowed; }
  </style>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f0f13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="财务健康">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="loading-screen" id="loading"><div class="spin"></div><p>加载中…</p></div>
<div class="phone" id="app" style="display:none">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons"><svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="2.5" stroke="white" stroke-width="1.2" fill="none" opacity="0.8"/><rect x="1.5" y="2.5" width="16" height="7" rx="1.5" fill="white"/><rect x="23" y="4" width="2" height="4" rx="1" fill="white" opacity="0.5"/></svg></div>
  </div>
  <div class="screen-content">
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div class="page-title">我的资产</div>
        <div class="page-sub">管理你的每一项资产</div>
      </div>
      <a href="investment.html" style="
        display:flex;align-items:center;gap:5px;
        height:34px;padding:0 12px;border-radius:12px;
        background:rgba(200,240,80,0.1);border:1px solid rgba(200,240,80,0.3);
        color:var(--accent);font-size:12px;font-weight:600;
        text-decoration:none;white-space:nowrap;margin-top:4px;
      ">📊 持仓明细</a>
    </div>
    <div class="net-bar">
      <div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">净资产</div>
        <div class="net-bar-val" id="nw-val">—</div>
      </div>
      <button class="add-fab" id="open-modal">＋ 添加资产</button>
    </div>
    <div id="asset-lists"></div>
  </div>
  <nav class="nav-bar">
    <a href="index.html" class="nav-item ">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="2" y="10" width="8" height="10" rx="2" fill="currentColor"/><rect x="12" y="2" width="8" height="18" rx="2" fill="currentColor" opacity="0.6"/></svg>
      <span>总览</span>
    </a>
    <a href="assets.html" class="nav-item active">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="2" y="2" width="9" height="9" rx="2.5" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="2" width="7" height="9" rx="2.5" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="13" width="7" height="7" rx="2.5" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="13" width="7" height="7" rx="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>资产</span>
    </a>
    <a href="cashflow.html" class="nav-item ">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 11h14M4 7l4-4 4 4M18 15l-4 4-4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>收支</span>
    </a>
    <a href="diagnosis.html" class="nav-item ">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8.5" stroke="currentColor" stroke-width="1.5"/><path d="M11 6v5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>诊断</span>
    </a>
    <a href="goals.html" class="nav-item ">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8.5" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="11" r="4" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="11" r="1.5" fill="currentColor"/></svg>
      <span>目标</span>
    </a>
  </nav>
</div>

<!-- 编辑资产弹窗 -->
<div class="edit-overlay" id="edit-overlay">
  <div class="edit-sheet">
    <div class="edit-handle"></div>
    <div style="display:flex;justify-content:flex-end;padding:0 0 4px">
      <button id="edit-close-btn" style="background:none;border:none;color:var(--text-muted);font-size:22px;cursor:pointer;padding:0 4px;line-height:1">×</button>
    </div>
    <div class="edit-asset-info">
      <div class="edit-asset-icon" id="edit-icon"></div>
      <div>
        <div class="edit-asset-name" id="edit-name"></div>
        <div class="edit-asset-type" id="edit-type"></div>
      </div>
    </div>
    <div class="edit-label">当前金额（元）</div>
    <div class="edit-amount-wrap">
      <span class="edit-prefix">¥</span>
      <input class="edit-amount-input" type="number" id="edit-amount" inputmode="decimal" placeholder="0">
    </div>
    <div class="edit-label">快速调整</div>
    <div class="edit-quick-row" id="edit-quick-row"></div>
    <button class="edit-save-btn" id="edit-save-btn">保存更新</button>
  </div>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">添加资产</div>
    <div class="field"><label>类型</label>
      <div class="type-grid" id="type-grid">
        <div class="type-btn selected" data-type="cash"><span class="type-btn-icon">💰</span><span class="type-btn-label">现金存款</span></div>
        <div class="type-btn" data-type="investment"><span class="type-btn-icon">📈</span><span class="type-btn-label">投资资产</span></div>
        <div class="type-btn" data-type="fixed"><span class="type-btn-icon">🏠</span><span class="type-btn-label">固定资产</span></div>
        <div class="type-btn" data-type="debt"><span class="type-btn-icon">💳</span><span class="type-btn-label">负债</span></div>
      </div>
    </div>
    <div class="field"><label>图标</label><div class="icon-grid" id="icon-grid"></div></div>
    <div class="field"><label>名称</label><input type="text" id="input-name" placeholder="如：工商银行储蓄卡" maxlength="20"></div>
    <div class="field"><label>备注（可选）</label><input type="text" id="input-note" placeholder="如：活期存款" maxlength="30"></div>
    <div class="field"><label>金额（元）</label>
      <div class="amount-wrap"><span class="amount-prefix">¥</span><input type="number" id="input-amount" placeholder="0" min="0" inputmode="decimal"></div>
    </div>
    <button class="save-btn" id="save-btn">保存</button>
  </div>
</div>

<script src="js/finance.js"></script>
<script src="supabase.js"></script>
<script>
let selectedType = 'cash';
let selectedIcon = TYPE_ICONS.cash[0];

function renderIconGrid(type) {
  const grid = document.getElementById('icon-grid');
  grid.innerHTML = '';
  selectedIcon = TYPE_ICONS[type][0];
  TYPE_ICONS[type].forEach((icon, i) => {
    const btn = document.createElement('div');
    btn.className = 'icon-btn' + (i === 0 ? ' selected' : '');
    btn.textContent = icon;
    btn.addEventListener('click', () => {
      selectedIcon = icon;
      grid.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
    grid.appendChild(btn);
  });
}

document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedType = btn.dataset.type;
    renderIconGrid(selectedType);
  });
});

document.getElementById('open-modal').addEventListener('click', () => {
  document.getElementById('input-name').value = '';
  document.getElementById('input-note').value = '';
  document.getElementById('input-amount').value = '';
  renderIconGrid('cash');
  document.getElementById('modal').classList.add('open');
});
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') document.getElementById('modal').classList.remove('open');
});

document.getElementById('save-btn').addEventListener('click', async () => {
  const name   = document.getElementById('input-name').value.trim();
  const note   = document.getElementById('input-note').value.trim();
  const amount = parseFloat(document.getElementById('input-amount').value);
  if (!name)              { alert('请填写名称'); return; }
  if (!amount || amount <= 0) { alert('请填写正确金额'); return; }
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = '保存中…';
  await dbAddAsset({ type: selectedType, name, note, amount, icon: selectedIcon });
  btn.disabled = false; btn.textContent = '保存';
  document.getElementById('modal').classList.remove('open');
  await render();
});

async function render() {
  const user = await requireAuth();
  if (!user) return;

  // 先同步持仓到资产表，再加载
  await dbSyncHoldingsAsset();

  const assets = await dbLoadAssets();
  const stats  = calcStats(assets);
  document.getElementById('nw-val').textContent = fmt(stats.netWorth);

  const listEl = document.getElementById('asset-lists');
  listEl.innerHTML = '';

  const groups = ['cash','investment','fixed','debt'];
  groups.forEach(type => {
    const items = assets.filter(a => a.type === type);
    if (items.length === 0) return;
    const cfg   = TYPE_CONFIG[type];
    const total = items.reduce((s, a) => s + Number(a.amount), 0);
    const group = document.createElement('div');
    group.className = 'asset-group';
    group.innerHTML = `<div class="group-label"><span>${cfg.emoji} ${cfg.label}</span><span style="font-size:13px;color:${cfg.color};font-weight:700">${fmt(total)}</span></div>`;
    items.forEach(a => {
      const card = document.createElement('div');
      card.className = 'asset-card';
      card.dataset.id = a.id;
      const isSync = a.note === '__holdings_sync__';
      card.innerHTML = `
        <div class="asset-icon" style="background:${cfg.iconBg}">${a.icon}</div>
        <div class="asset-info">
          <div class="asset-name">${a.name}</div>
          ${isSync
            ? `<div class="asset-note" style="color:rgba(200,240,80,0.6)">🔗 自动同步持仓明细</div>`
            : (a.note ? `<div class="asset-note">${a.note}</div>` : '')
          }
        </div>
        <div class="asset-amt" style="color:${cfg.color}">${fmt(a.amount)}</div>
        ${isSync ? '' : `<button class="del-btn" data-id="${a.id}">✕</button>`}`;
      if (isSync) card.addEventListener('click', () => location.href = 'investment.html');
      group.appendChild(card);
    });

    listEl.appendChild(group);
  });

  listEl.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      if (!confirm('确认删除？')) return;
      btn.textContent = '…';
      await dbDeleteAsset(btn.dataset.id);
      await render();
    });
  });


  // 点击卡片打开编辑弹窗
  listEl.querySelectorAll('.asset-card').forEach(card => {
    card.addEventListener('click', () => {
      const id     = card.dataset.id;
      const asset  = assets.find(a => a.id === id);
      if (!asset) return;
      const cfg    = TYPE_CONFIG[asset.type];
      document.getElementById('edit-icon').textContent    = asset.icon;
      document.getElementById('edit-icon').style.background = cfg.iconBg;
      document.getElementById('edit-name').textContent   = asset.name;
      document.getElementById('edit-type').textContent   = cfg.label;
      document.getElementById('edit-amount').value       = asset.amount;

      // 快速调整按钮（±）
      const quickRow = document.getElementById('edit-quick-row');
      quickRow.innerHTML = '';
      const quickVals = [-10000, -5000, -1000, +1000, +5000, +10000];
      quickVals.forEach(v => {
        const btn = document.createElement('button');
        btn.className = 'edit-quick-btn';
        btn.textContent = (v > 0 ? '+' : '') + (v/10000).toFixed(1) + '万';
        btn.addEventListener('click', () => {
          const cur = parseFloat(document.getElementById('edit-amount').value) || 0;
          document.getElementById('edit-amount').value = Math.max(0, cur + v);
        });
        quickRow.appendChild(btn);
      });

      document.getElementById('edit-overlay').dataset.id = id;
      document.getElementById('edit-overlay').classList.add('open');
      setTimeout(() => document.getElementById('edit-amount').select(), 350);
    });
  });

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = '';
}

renderIconGrid('cash');
render();

// 编辑弹窗：关闭
function closeEditModal() {
  document.getElementById('edit-overlay').classList.remove('open');
}
document.getElementById('edit-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('edit-overlay')) closeEditModal();
});
document.getElementById('edit-close-btn').addEventListener('click', closeEditModal);

// 编辑弹窗：保存
document.getElementById('edit-save-btn').addEventListener('click', async () => {
  const id     = document.getElementById('edit-overlay').dataset.id;
  const amount = parseFloat(document.getElementById('edit-amount').value);
  if (isNaN(amount) || amount < 0) { alert('请输入正确金额'); return; }
  const btn = document.getElementById('edit-save-btn');
  btn.disabled = true; btn.textContent = '保存中…';
  const { error } = await sb.from('assets').update({ amount }).eq('id', id);
  if (!error) await dbSaveSnapshot();
  btn.disabled = false; btn.textContent = '保存更新';
  document.getElementById('edit-overlay').classList.remove('open');
  await render();
});
</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>

</body>
