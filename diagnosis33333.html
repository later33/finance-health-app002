<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>财务健康 · 诊断</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="base.css">
  <style>
    .diag-banner {
      margin: 0 24px 16px;
      border-radius: 24px; padding: 24px;
      border: 1px solid rgba(240,184,76,0.2);
      background: linear-gradient(135deg, #1e1628, #16162a);
      display: flex; align-items: center; gap: 20px;
    }
    .diag-ring-wrap { position: relative; width: 88px; height: 88px; flex-shrink: 0; }
    .diag-ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .diag-ring-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; line-height: 1;
    }
    .diag-ring-score { font-size: 26px; font-weight: 700; color: var(--text); }
    .diag-ring-sub { font-size: 9px; color: var(--text-muted); margin-top: 2px; }
    .diag-info { flex: 1; }
    .diag-grade-pill {
      display: inline-block; font-size: 12px; font-weight: 600;
      padding: 3px 12px; border-radius: 20px; margin-bottom: 8px;
    }
    .diag-headline { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.5; }

    .problem-banner {
      margin: 0 24px 16px;
      border-radius: 16px; padding: 14px 16px;
      display: flex; gap: 10px; align-items: flex-start;
      background: var(--warn-dim); border: 1px solid rgba(255,107,107,0.2);
    }
    .problem-banner.ok { background: var(--ok-dim); border-color: rgba(92,240,176,0.2); }
    .problem-icon { font-size: 18px; flex-shrink: 0; }
    .problem-text { font-size: 13px; color: var(--text); line-height: 1.6; }
    .problem-text strong.w { color: var(--warn); }
    .problem-text strong.g { color: var(--ok); }

    .dim-list { padding: 0 24px; display: flex; flex-direction: column; gap: 12px; }
    .dim-card {
      background: var(--surface); border-radius: 18px;
      padding: 16px 18px; border: 1px solid var(--border);
    }
    .dim-top {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 4px;
    }
    .dim-name-wrap { display: flex; align-items: center; gap: 8px; }
    .dim-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .dim-score-badge { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 20px; }
    .badge-warn { background: var(--warn-dim); color: var(--warn); }
    .badge-ok   { background: var(--ok-dim);   color: var(--ok); }
    .badge-mid  { background: var(--mid-dim);  color: var(--mid); }

    .dim-actual-row {
      display: flex; justify-content: space-between;
      align-items: baseline; margin-bottom: 8px;
    }
    .dim-actual { font-size: 20px; font-weight: 700; }
    .dim-bench  { font-size: 11px; color: var(--text-muted); }

    .dim-progress-bg { height: 6px; background: rgba(255,255,255,0.06); border-radius: 6px; margin-bottom: 8px; }
    .dim-progress-fill { height: 6px; border-radius: 6px; transition: width 0.8s cubic-bezier(0.22,1,0.36,1); }
    .dim-desc { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
    .dim-tip {
      margin-top: 8px; padding: 8px 10px;
      border-radius: 10px; font-size: 11px; line-height: 1.5;
    }
    .tip-warn { background: var(--warn-dim); color: var(--warn); }
    .tip-ok   { background: var(--ok-dim);   color: var(--ok); }
    .tip-mid  { background: var(--mid-dim);  color: var(--mid); }

    .cta-wrap { padding: 20px 24px 0; }
    .cta-btn {
      display: flex; align-items: center; justify-content: center;
      height: 52px; border-radius: 16px; border: none; font-family: inherit;
      background: var(--accent); color: #0f0f13; width: 100%;
      font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer;
      transition: transform 0.12s, opacity 0.12s;
    }
    .cta-btn:active { transform: scale(0.98); opacity: 0.9; }

    .empty-diag { margin: 48px 24px; text-align: center; color: var(--text-muted); }
    .empty-diag .ei { font-size: 48px; margin-bottom: 16px; }
    .empty-diag p { font-size: 14px; line-height: 1.7; }
    .empty-diag a { color: var(--accent); text-decoration: none; }

    .loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:200;}
    .spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loading-screen p{font-size:13px;color:var(--text-muted);}

    /* ── 行动建议弹窗 ── */
    .advice-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;align-items:flex-end;justify-content:center; }
    .advice-overlay.open { display:flex; }
    .advice-sheet {
      width:375px;background:var(--surface2);border-radius:28px 28px 0 0;
      padding:0 0 40px;transform:translateY(100%);
      transition:transform 0.38s cubic-bezier(0.32,0.72,0,1);
      max-height:88vh;overflow-y:auto;
    }
    .advice-overlay.open .advice-sheet { transform:translateY(0); }
    .advice-handle { width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0; }
    .advice-header { padding:16px 24px 12px;border-bottom:1px solid var(--border); }
    .advice-header-title { font-size:18px;font-weight:700;color:var(--text); }
    .advice-header-sub { font-size:12px;color:var(--text-muted);margin-top:3px; }
    .advice-loading { padding:40px 24px;text-align:center; }
    .advice-loading .spin2 {
      width:32px;height:32px;border:3px solid var(--border);
      border-top-color:var(--accent);border-radius:50%;
      animation:spin 0.8s linear infinite;margin:0 auto 12px;
    }
    .advice-loading p { font-size:13px;color:var(--text-muted); }
    .advice-items { padding:16px 24px;display:flex;flex-direction:column;gap:12px; }
    .advice-item {
      background:var(--surface);border-radius:16px;padding:16px;
      border:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;
      animation: fadeUp 0.35s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .advice-item:nth-child(1){animation-delay:0.05s}
    .advice-item:nth-child(2){animation-delay:0.1s}
    .advice-item:nth-child(3){animation-delay:0.15s}
    .advice-item:nth-child(4){animation-delay:0.2s}
    .advice-item:nth-child(5){animation-delay:0.25s}
    .adv-icon {
      width:38px;height:38px;border-radius:12px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:18px;
    }
    .adv-body { flex:1; }
    .adv-title { font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px; }
    .adv-desc  { font-size:12px;color:var(--text-muted);line-height:1.6; }
    .adv-tag {
      display:inline-block;font-size:10px;font-weight:600;
      padding:2px 8px;border-radius:20px;margin-top:6px;
    }
    .tag-urgent { background:var(--warn-dim);color:var(--warn); }
    .tag-good   { background:var(--ok-dim);  color:var(--ok);   }
    .tag-tip    { background:var(--mid-dim); color:var(--mid);  }
  </style>

<script>
// ─────────────────────────────────────────────────────────
//  诊断引擎
// ─────────────────────────────────────────────────────────
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function scoreStyle(s){
  if(s>=75) return {bar:'var(--ok)',  badge:'badge-ok',  tip:'tip-ok' };
  if(s>=45) return {bar:'var(--mid)', badge:'badge-mid', tip:'tip-mid'};
  return          {bar:'var(--warn)', badge:'badge-warn', tip:'tip-warn'};
}

function runDiagnosis(data){
  const stats = calcStats(data.assets);
  const {byType, totalAssets, totalDebt, netWorth, debtRatio} = stats;
  const dr = parseFloat(debtRatio);
  const hist = data.history || [];

  // 月均净资产变化（有历史时使用）
  let monthlyDelta = null;
  if(hist.length >= 2){
    const diffs = [];
    for(let i=1;i<hist.length;i++) diffs.push(hist[i].netWorth - hist[i-1].netWorth);
    monthlyDelta = diffs.reduce((a,b)=>a+b,0)/diffs.length;
  }

  // ── 1. 应急资金 ──────────────────────────────────────
  // 估算月支出：无收支数据时用 总资产×2% 作保守代理
  const estMonthExp = totalAssets > 0 ? Math.max(totalAssets * 0.02, 2000) : 3000;
  const emMonths = byType.cash / estMonthExp;
  let emScore;
  if(emMonths>=6) emScore=100;
  else if(emMonths>=3) emScore=80;
  else if(emMonths>=1) emScore=50;
  else if(emMonths>=0.5) emScore=25;
  else emScore=10;

  const dim1 = {
    icon:'🆘', name:'应急资金',
    score: emScore,
    actual: emMonths.toFixed(1)+'个月',
    bench: '目标：≥ 3 个月',
    desc: emMonths>=6
      ? `现金储备约 ${emMonths.toFixed(1)} 个月支出，远超安全线，非常健康。`
      : emMonths>=3
      ? `现金储备约 ${emMonths.toFixed(1)} 个月支出，达到基本安全标准。`
      : `现金储备仅约 ${emMonths.toFixed(1)} 个月支出，低于 3 个月的安全线。`,
    tip: emMonths<3
      ? `💡 建议将现金存款提升至 ${fmt(estMonthExp*3)}（估算3个月支出）`
      : null
  };

  // ── 2. 负债健康度 ─────────────────────────────────────
  let debtScore;
  if(dr===0) debtScore=100;
  else if(dr<=15) debtScore=95;
  else if(dr<=30) debtScore=80;
  else if(dr<=50) debtScore=55;
  else if(dr<=70) debtScore=30;
  else debtScore=10;

  const dim2 = {
    icon:'💳', name:'负债健康度',
    score: debtScore,
    actual: dr+'%',
    bench: '健康线：≤ 30%',
    desc: dr===0
      ? '目前没有任何负债，财务自由度极高！'
      : dr<=30
      ? `负债率 ${dr}%，处于健康区间（≤30%），结构合理。`
      : `负债率 ${dr}%，超出健康线，建议优先减少高息负债。`,
    tip: dr>30
      ? `💡 目标：将负债降至 ${fmt(totalAssets*0.3)}（总资产30%）`
      : null
  };

  // ── 3. 资产结构 ───────────────────────────────────────
  // 评估流动资产占比（现金+投资 vs 固定）
  const liquid = byType.cash + byType.investment;
  const liquidRatio = totalAssets>0 ? liquid/totalAssets : 0;
  // 有现金+投资+固定三类各有则高分
  const typeCount = ['cash','investment','fixed'].filter(t=>byType[t]>0).length;
  const structScore = Math.round(
    clamp(liquidRatio*60, 0, 60) +   // 流动性越高越好，最高60分
    typeCount * 13                    // 每多一类加13分，满3类=39分
  );

  const dim3 = {
    icon:'📊', name:'资产结构',
    score: clamp(structScore, 5, 100),
    actual: (liquidRatio*100).toFixed(0)+'% 流动',
    bench: '建议流动资产 ≥ 40%',
    desc: liquidRatio>=0.5
      ? `流动资产（现金+投资）占 ${(liquidRatio*100).toFixed(0)}%，资产灵活度高。`
      : liquidRatio>=0.3
      ? `流动资产占 ${(liquidRatio*100).toFixed(0)}%，基本合理，可逐步提升。`
      : `流动资产仅占 ${(liquidRatio*100).toFixed(0)}%，固定资产比重过高，流动性偏低。`,
    tip: liquidRatio<0.3
      ? '💡 建议减少闲置固定资产，将更多资金配置到流动资产'
      : typeCount<2
      ? '💡 建议增加投资类资产，分散单一资产风险'
      : null
  };

  // ── 4. 储蓄能力（优先读收支记录，降级用历史快照）─────────
  let savScore, savActual, savDesc, savTip;
  const cfMonths = [...new Set((data.cashflow||[]).map(c=>c.date))].sort();
  const latestCfMonth = cfMonths[cfMonths.length-1] || null;
  if(latestCfMonth){
    const cf = calcCashflow(data.cashflow||[], latestCfMonth);
    const sr = parseInt(cf.savRate);
    savScore  = sr>=30?100:sr>=20?85:sr>=10?60:sr>=0?35:10;
    savActual = cf.income>0 ? cf.savRate+'%' : '数据不足';
    const [y,m] = latestCfMonth.split('-');
    const mLabel = parseInt(m)+'月';
    savDesc = cf.income===0
      ? `${mLabel}还没有收入记录，无法计算储蓄率。`
      : sr>=20
      ? `${mLabel}储蓄率 ${sr}%，达到建议水平（≥20%），继续保持！`
      : sr>=10
      ? `${mLabel}储蓄率 ${sr}%，离目标 20% 还有差距，检查大项支出。`
      : `${mLabel}储蓄率仅 ${sr}%，建议削减非必要支出。`;
    savTip = sr<20 && cf.income>0
      ? `💡 前往「收支」页调整支出，目标储蓄率 ≥ 20%`
      : null;
  } else if(monthlyDelta !== null){
    const rate = totalAssets>0 ? monthlyDelta/totalAssets : 0;
    savScore  = clamp(Math.round(rate*1000+50), 5, 100);
    savActual = (monthlyDelta>=0?'+':'')+fmt(monthlyDelta)+'/月';
    savDesc   = monthlyDelta>0
      ? `近期净资产月均增长 ${fmt(monthlyDelta)}，储蓄正在积累。`
      : `近期净资产月均减少 ${fmt(Math.abs(monthlyDelta))}，需关注支出。`;
    savTip    = '💡 前往「收支」页记录收支，获取精准储蓄率';
  } else {
    savScore  = 40;
    savActual = '待录入';
    savDesc   = '前往「收支」页面记录收入和支出，系统将自动计算储蓄率。';
    savTip    = '💡 记录一个月的收支，即可获得精准储蓄率评分';
  }

  const dim4 = {
    icon:'💰', name:'储蓄能力',
    score: savScore,
    actual: savActual,
    bench: '建议储蓄率 ≥ 20%',
    desc: savDesc,
    tip: savTip
  };


  // ── 5. 净资产成长 ─────────────────────────────────────
  // 根据历史趋势判断是否持续增长
  let growScore, growActual, growDesc, growTip;
  if(hist.length>=3){
    const first = hist[0].netWorth;
    const last  = hist[hist.length-1].netWorth;
    const totalGrow = last - first;
    // 计算有多少个月是正增长
    let positiveMonths = 0;
    for(let i=1;i<hist.length;i++){
      if(hist[i].netWorth > hist[i-1].netWorth) positiveMonths++;
    }
    const growRate = positiveMonths/(hist.length-1);
    growScore = Math.round(growRate*70 + (totalGrow>0?30:0));
    growActual = (totalGrow>=0?'+':'')+fmt(totalGrow);
    growDesc = growRate>=0.7
      ? `${hist.length} 个记录中 ${positiveMonths} 次净增长，趋势稳健向上。`
      : growRate>=0.4
      ? `净资产有增有降，总体${totalGrow>=0?'略有增长':'略有下降'}，需保持稳定。`
      : `净资产波动较大，建议检查大额支出或投资亏损。`;
    growTip = growRate<0.5 ? '💡 建议减少不必要的大额支出，稳定增加净资产' : null;
  } else {
    growScore = 50;
    growActual = '数据积累中';
    growDesc = '继续录入资产数据，系统将分析你的净资产成长趋势。';
    growTip = '💡 坚持每月更新，3个月后即可看到完整趋势';
  }

  const dim5 = {
    icon:'🌱', name:'净资产成长',
    score: clamp(growScore,5,100),
    actual: growActual,
    bench: '目标：持续正增长',
    desc: growDesc,
    tip: growTip
  };

  // ── 综合评分（加权平均）────────────────────────────────
  const weights = [0.25, 0.25, 0.20, 0.15, 0.15];
  const dims = [dim1, dim2, dim3, dim4, dim5];
  const total = Math.round(
    dims.reduce((sum,d,i) => sum + d.score * weights[i], 0)
  );

  return { total, dims };
}

// ─────────────────────────────────────────────────────────
//  渲染
// ─────────────────────────────────────────────────────────
async function render(){
  const user = await requireAuth();
  if(!user) return;
  const assets  = await dbLoadAssets();
  const history = await dbLoadHistory();
  const cfRows  = await dbLoadCashflow();
  const data = { assets, history: history.map(h=>({date:h.date,netWorth:h.netWorth})), cashflow: cfRows };
  const hasAssets = data.assets.length > 0;

  if(!hasAssets){
    document.getElementById('diag-body').innerHTML = `
      <div class="empty-diag">
        <div class="ei">📋</div>
        <p>还没有资产数据。<br>先去<a href="assets.html">录入你的资产</a>，<br>系统才能为你生成诊断报告。</p>
      </div>`;
    return;
  }

  const {total, dims} = runDiagnosis(data);
  const ss = scoreStyle(total);

  // 问题列表
  const problems = dims.filter(d=>d.score<50).map(d=>d.name);
  const isHealthy = problems.length===0;

  // 总评描述
  const headline = total>=80
    ? '你的财务状况非常健康，继续保持！'
    : total>=60
    ? '整体良好，还有 '+problems.join('、')+' 方面可以改善。'
    : total>=40
    ? problems.join('、')+' 是当前主要薄弱点，需要优先改善。'
    : '财务状况需要认真关注，建议从降低负债和增加应急储备开始。';

  const gradeLabel = total>=80?'健康 ✅':total>=60?'良好 👍':total>=40?'待改善 ⚠️':'需关注 🔴';

  // 渲染 Banner
  const ringOffset = (2*Math.PI*34*(1-total/100)).toFixed(1);
  const bannerColor = ss.bar;

  let html = `
    <!-- 总分 Banner -->
    <div class="diag-banner">
      <div class="diag-ring-wrap">
        <svg viewBox="0 0 88 88">
          <circle fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="7" cx="44" cy="44" r="34"/>
          <circle fill="none" stroke="${bannerColor}" stroke-width="7"
            stroke-linecap="round" cx="44" cy="44" r="34"
            stroke-dasharray="${(2*Math.PI*34).toFixed(1)}"
            stroke-dashoffset="${ringOffset}"/>
        </svg>
        <div class="diag-ring-center">
          <span class="diag-ring-score">${total}</span>
          <span class="diag-ring-sub">/100</span>
        </div>
      </div>
      <div class="diag-info">
        <div class="diag-grade-pill" style="background:${bannerColor}22;color:${bannerColor}">${gradeLabel}</div>
        <div class="diag-headline">${headline}</div>
      </div>
    </div>

    <!-- 问题/健康提示 -->
    <div class="problem-banner ${isHealthy?'ok':''}">
      <div class="problem-icon">${isHealthy?'✨':'🔍'}</div>
      <div class="problem-text">`;

  if(isHealthy){
    html += `所有维度评分均在健康区间，<strong class="g">财务结构良好</strong>，继续保持当前习惯。`;
  } else {
    html += `主要问题：`;
    html += problems.map(p=>`<strong class="w">${p}</strong>`).join('、');
    html += `。建议优先从得分最低的维度开始改善。`;
  }

  html += `</div></div>

    <!-- 维度标题 -->
    <div class="section-header" style="padding-bottom:4px">
      <span class="section-title">各维度评分</span>
    </div>

    <!-- 各维度 -->
    <div class="dim-list">`;

  dims.forEach(d=>{
    const s = scoreStyle(d.score);
    html += `
      <div class="dim-card">
        <div class="dim-top">
          <div class="dim-name-wrap">
            <span>${d.icon}</span>
            <span class="dim-name">${d.name}</span>
          </div>
          <div class="dim-score-badge ${s.badge}">${d.score}分</div>
        </div>
        <div class="dim-actual-row">
          <span class="dim-actual" style="color:${s.bar}">${d.actual}</span>
          <span class="dim-bench">${d.bench}</span>
        </div>
        <div class="dim-progress-bg">
          <div class="dim-progress-fill" style="width:${d.score}%;background:${s.bar}"></div>
        </div>
        <div class="dim-desc">${d.desc}</div>
        ${d.tip ? `<div class="dim-tip ${s.tip}">${d.tip}</div>` : ''}
      </div>`;
  });

  html += `</div>

    <!-- CTA -->
    <div class="cta-wrap">
      <button class="cta-btn" id="advice-btn">查看行动建议 →</button>
    </div>`;

  document.getElementById('diag-body').innerHTML = html;
  document.getElementById('diag-sub').textContent =
    '最后更新：' + new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric'});
}

render().then(() => {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = '';

  // 弹窗关闭
  document.getElementById('advice-overlay').addEventListener('click', e => {
    if (e.target.id === 'advice-overlay')
      document.getElementById('advice-overlay').classList.remove('open');
  });

  // 按钮点击
  document.getElementById('advice-btn').addEventListener('click', async () => {
    document.getElementById('advice-overlay').classList.add('open');
    const now = new Date();
    document.getElementById('advice-date').textContent =
      now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 · 基于你的真实数据';
    document.getElementById('advice-content').innerHTML =
      '<div class="advice-loading"><div class="spin2"></div><p>分析你的财务数据中…</p></div>';
    try {
      const [assets, cfRows] = await Promise.all([dbLoadAssets(), dbLoadCashflow()]);
      const stats  = calcStats(assets);
      const now2   = new Date();
      const month  = now2.getFullYear() + '-' + String(now2.getMonth()+1).padStart(2,'0');
      const cfData = calcCashflow(cfRows, month);
      const dr     = parseFloat(stats.debtRatio);
      const debtScore  = dr===0?100:dr<=30?80:dr<=50?55:30;
      const typeCount  = ['cash','investment','fixed'].filter(t=>stats.byType[t]>0).length;
      const score      = Math.round(debtScore*0.5 + typeCount*33*0.3);

      // ── 生成建议 ──────────────────────────────────────
      const items = [];
      // 负债率
      if (dr > 50) items.push({ icon:'💳', iconBg:'rgba(255,107,107,0.12)', title:'优先偿还高息负债', desc:`你的负债率已达 ${dr}%，建议每月收入的 20% 用于还款，优先清偿利率最高的债务。`, tag:'紧急', tagClass:'tag-urgent' });
      else if (dr > 30) items.push({ icon:'💳', iconBg:'rgba(240,184,76,0.12)', title:'控制负债增长', desc:`负债率 ${dr}%，处于警戒线附近。近期避免新增贷款，逐步将负债率降至 30% 以下。`, tag:'建议', tagClass:'tag-tip' });
      // 储蓄率
      if (cfData && cfData.income > 0) {
        const sr = parseInt(cfData.savRate);
        if (sr < 10)       items.push({ icon:'💰', iconBg:'rgba(255,107,107,0.12)', title:'建立强制储蓄习惯', desc:`本月储蓄率仅 ${sr}%，建议发薪日立即转出收入的 10% 到独立账户，先存钱后消费。`, tag:'紧急', tagClass:'tag-urgent' });
        else if (sr < 20)  items.push({ icon:'📈', iconBg:'rgba(200,240,80,0.12)',  title:'提升储蓄率到 20%', desc:`储蓄率 ${sr}%，还有提升空间。检查餐饮、购物支出，每月多存 ${Math.round(cfData.income*0.05/100)*100} 元。`, tag:'建议', tagClass:'tag-tip' });
        else               items.push({ icon:'🎉', iconBg:'rgba(92,240,176,0.12)',  title:'储蓄率良好，考虑投资', desc:`储蓄率 ${sr}%，表现优秀！闲置资金可考虑低风险理财或指数基金，让钱生钱。`, tag:'做得好', tagClass:'tag-good' });
      } else {
        items.push({ icon:'📝', iconBg:'rgba(200,240,80,0.12)', title:'开始记录每月收支', desc:'在「收支」页面记录你的收入和支出，系统将自动计算储蓄率并给出精准建议。', tag:'行动', tagClass:'tag-tip' });
      }
      // 资产配置
      const cashRatio   = stats.totalAssets > 0 ? stats.byType.cash / stats.totalAssets : 0;
      const investRatio = stats.totalAssets > 0 ? stats.byType.investment / stats.totalAssets : 0;
      if (cashRatio > 0.8 && stats.totalAssets > 50000)
        items.push({ icon:'📊', iconBg:'rgba(96,208,240,0.12)', title:'分散资产，避免现金贬值', desc:`现金占比 ${(cashRatio*100).toFixed(0)}%，建议将 30-40% 配置到稳健投资（如货币基金、债券），对抗通胀。`, tag:'建议', tagClass:'tag-tip' });
      else if (investRatio === 0 && stats.totalAssets > 20000)
        items.push({ icon:'🌱', iconBg:'rgba(92,240,176,0.12)', title:'开始小额投资', desc:'你目前没有投资资产，可以从每月定投 500 元指数基金开始，长期复利效果显著。', tag:'建议', tagClass:'tag-tip' });
      // 应急金
      const mExp = cfData?.expense || 0;
      if (mExp > 0 && stats.byType.cash < mExp*6)
        items.push({ icon:'🛡️', iconBg:'rgba(200,240,80,0.12)', title:'建立应急储备金', desc:`建议保留 6 个月支出（约 ${fmt(mExp*6)}）作为应急资金。你还需要再存 ${fmt(mExp*6 - stats.byType.cash)}。`, tag:'重要', tagClass:'tag-tip' });
      // 综合
      if (score >= 75)
        items.push({ icon:'🏆', iconBg:'rgba(92,240,176,0.12)', title:'财务状况良好，继续保持', desc:'你的综合财务健康分不错！下一步可以设定中长期目标，比如提前退休或购房计划。', tag:'做得好', tagClass:'tag-good' });
      if (items.length === 0)
        items.push({ icon:'📌', iconBg:'rgba(200,240,80,0.12)', title:'继续完善财务数据', desc:'添加更多资产和收支记录，系统将生成更精准的个性化建议。', tag:'提示', tagClass:'tag-tip' });

      // ── 渲染建议 ──────────────────────────────────────
      const html = items.map(item =>
        `<div class="advice-item">
          <div class="adv-icon" style="background:${item.iconBg}">${item.icon}</div>
          <div class="adv-body">
            <div class="adv-title">${item.title}</div>
            <div class="adv-desc">${item.desc}</div>
            <span class="adv-tag ${item.tagClass}">${item.tag}</span>
          </div>
        </div>`).join('');
      document.getElementById('advice-content').innerHTML = `<div class="advice-items">${html}</div>`;

    } catch(err) {
      console.error(err);
      document.getElementById('advice-content').innerHTML =
        '<div style="padding:24px;text-align:center;color:var(--text-muted)">加载失败，请重试</div>';
    }
  });
});
</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>

<!-- 行动建议弹窗 -->
<div class="advice-overlay" id="advice-overlay">
  <div class="advice-sheet">
    <div class="advice-handle"></div>
    <div class="advice-header">
      <div class="advice-header-title">🎯 专属行动建议</div>
      <div class="advice-header-sub" id="advice-date">根据你的财务状况生成</div>
    </div>
    <div id="advice-content">
      <div class="advice-loading">
        <div class="spin2"></div>
        <p>分析你的财务数据中…</p>
      </div>
    </div>
  </div>
</div>
