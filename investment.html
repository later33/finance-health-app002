<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>财务健康 · 投资持仓</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="base.css">
  <style>
    /* 顶部汇总卡片 */
    .portfolio-card {
      margin: 0 24px 16px;
      background: linear-gradient(135deg, #141a10, #0f1a14);
      border-radius: 20px; padding: 20px;
      border: 1px solid rgba(200,240,80,0.2);
    }
    .portfolio-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.05em; }
    .portfolio-total { font-size: 32px; font-weight: 800; color: var(--text); margin-bottom: 14px; }
    .portfolio-row   { display: flex; gap: 8px; }
    .portfolio-stat  { flex: 1; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px; }
    .ps-label { font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
    .ps-val   { font-size: 14px; font-weight: 700; }
    .ps-val.up   { color: var(--ok); }
    .ps-val.down { color: var(--warn); }
    .ps-val.flat { color: var(--text-muted); }

    /* 分类 tab */
    .type-tabs { display: flex; gap: 6px; padding: 0 24px 14px; overflow-x: auto; scrollbar-width: none; }
    .type-tabs::-webkit-scrollbar { display: none; }
    .type-tab {
      height: 30px; padding: 0 14px; border-radius: 10px; white-space: nowrap;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-muted); font-size: 12px; font-family: inherit;
      cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    }
    .type-tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    /* 持仓列表 */
    .holdings-list { padding: 0 24px; }
    .holding-card {
      background: var(--surface); border-radius: 16px;
      padding: 14px; margin-bottom: 8px;
      border: 1px solid var(--border);
      cursor: pointer; transition: border-color 0.15s, transform 0.12s;
    }
    .holding-card:active { transform: scale(0.98); }
    .holding-card:hover  { border-color: rgba(200,240,80,0.3); }

    .hc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .hc-icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
      background: rgba(200,240,80,0.1);
    }
    .hc-info { flex: 1; min-width: 0; }
    .hc-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .hc-code { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .hc-mktval { text-align: right; }
    .hc-mktval-num { font-size: 16px; font-weight: 700; color: var(--text); }
    .hc-pnl { font-size: 11px; margin-top: 2px; font-weight: 600; }
    .hc-pnl.up   { color: var(--ok); }
    .hc-pnl.down { color: var(--warn); }
    .hc-pnl.flat { color: var(--text-muted); }

    /* 持仓详情行 */
    .hc-bottom { display: flex; gap: 0; border-top: 1px solid var(--border); padding-top: 10px; }
    .hc-detail { flex: 1; text-align: center; }
    .hc-detail-label { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
    .hc-detail-val   { font-size: 12px; font-weight: 500; color: var(--text); }
    .hc-detail + .hc-detail { border-left: 1px solid var(--border); }

    /* 空状态 */
    .empty-state { text-align: center; padding: 40px 24px; color: var(--text-muted); }
    .empty-icon  { font-size: 40px; margin-bottom: 12px; }
    .empty-text  { font-size: 14px; line-height: 1.7; }

    /* 添加按钮 */
    .fab-wrap { padding: 0 24px 12px; display: flex; justify-content: flex-end; }
    .add-fab {
      height: 44px; padding: 0 20px; border-radius: 22px; border: none;
      background: var(--accent); color: #0f0f13; font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 6px;
      transition: transform 0.12s;
    }
    .add-fab:active { transform: scale(0.97); }

    /* 弹窗 */
    .modal-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:flex-end;justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { width:375px;background:var(--surface2);border-radius:28px 28px 0 0;padding:0 24px 44px;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);max-height:90vh;overflow-y:auto; }
    .modal-overlay.open .modal { transform:translateY(0); }
    .modal-handle { width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 18px; }
    .modal-title  { font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px; }
    .modal-sub    { font-size:12px;color:var(--text-muted);margin-bottom:20px; }

    /* 类型选择 */
    .htype-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px; }
    .htype-btn {
      background:var(--surface);border:1.5px solid var(--border);
      border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;transition:all 0.15s;
    }
    .htype-btn.selected { border-color:var(--accent);background:var(--accent-dim); }
    .htype-btn-icon  { font-size:20px; margin-bottom:3px; }
    .htype-btn-label { font-size:10px;color:var(--text-muted); }

    /* 表单字段 */
    .field { margin-bottom:14px; }
    .field label { display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px; }
    .field input, .field select {
      width:100%;height:48px;background:var(--surface);border:1.5px solid var(--border);
      border-radius:12px;padding:0 14px;font-size:15px;font-family:inherit;
      color:var(--text);outline:none;transition:border-color 0.15s;
    }
    .field input:focus, .field select:focus { border-color:var(--accent); }
    .field-row { display:flex;gap:10px; }
    .field-row .field { flex:1; }
    .amount-wrap { position:relative; }
    .amount-prefix { position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px; }
    .amount-wrap input { padding-left:26px; }
    .save-btn {
      width:100%;height:52px;border:none;border-radius:16px;
      background:var(--accent);color:#0f0f13;font-size:16px;font-weight:700;
      font-family:inherit;cursor:pointer;margin-top:6px;transition:transform 0.12s,opacity 0.12s;
    }
    .save-btn:active  { transform:scale(0.97); }
    .save-btn:disabled { opacity:0.5;cursor:not-allowed; }

    /* 编辑弹窗 */
    .edit-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:150;align-items:flex-end;justify-content:center; }
    .edit-overlay.open { display:flex; }
    .edit-sheet { width:375px;background:var(--surface2);border-radius:28px 28px 0 0;padding:0 24px 44px;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);max-height:90vh;overflow-y:auto; }
    .edit-overlay.open .edit-sheet { transform:translateY(0); }
    .edit-handle { width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 8px; }
    .edit-top { display:flex;justify-content:space-between;align-items:center;margin-bottom:16px; }
    .edit-title { font-size:17px;font-weight:700;color:var(--text); }
    .edit-close { background:none;border:none;color:var(--text-muted);font-size:22px;cursor:pointer;padding:0; }
    .edit-del-btn {
      width:100%;height:48px;border:1.5px solid var(--warn);border-radius:14px;
      background:transparent;color:var(--warn);font-size:14px;font-weight:600;
      font-family:inherit;cursor:pointer;margin-top:8px;transition:background 0.15s;
    }
    .edit-del-btn:active { background:var(--warn-dim); }



    /* 三种货币总值 */
    .currency-totals-row { display:flex; align-items:center; margin:8px 0 0; }
    .currency-total-item { flex:1; text-align:center; }
    .ct-cur  { font-size:10px; font-weight:700; color:var(--accent); letter-spacing:0.08em; margin-bottom:4px; }
    .ct-val  { font-size:18px; font-weight:800; color:var(--text); line-height:1.1; }
    .ct-sub  { font-size:10px; color:var(--text-muted); margin-top:3px; }
    .currency-divider { width:1px; height:40px; background:rgba(255,255,255,0.08); flex-shrink:0; }

    /* 货币切换 */
    .currency-bar { display:flex; align-items:center; justify-content:space-between; padding:0 24px 12px; }
    .currency-label { font-size:11px; color:var(--text-muted); }
    .currency-btns  { display:flex; gap:4px; }
    .currency-btn {
      height:28px; padding:0 12px; border-radius:8px;
      background:var(--surface); border:1px solid var(--border);
      color:var(--text-muted); font-size:11px; font-weight:600;
      font-family:inherit; cursor:pointer; transition:all 0.15s;
    }
    .currency-btn.active { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }

    .loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:200;}
    .spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loading-screen p{font-size:13px;color:var(--text-muted);}
  </style>
</head>

<script>
// ── 时钟 ──────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
}
updateClock(); setInterval(updateClock, 10000);

// ── 类型配置 ──────────────────────────────────────────
const HTYPE = {
  stock:  { label: '股票',   icon: '📊', bg: 'rgba(200,240,80,0.12)' },
  fund:   { label: '基金',   icon: '📦', bg: 'rgba(96,208,240,0.12)' },
  bond:   { label: '债券',   icon: '🏦', bg: 'rgba(240,184,76,0.12)' },
  crypto: { label: '加密货币', icon: '🪙', bg: 'rgba(255,107,107,0.12)' },
  other:  { label: '其他',   icon: '💼', bg: 'rgba(160,160,200,0.12)' },
};

// ── 状态 ──────────────────────────────────────────────
let allHoldings   = [];
let selectedType  = 'all';
let selectedHType = 'stock';
let displayCur    = 'CNY'; // 当前显示货币
let rates         = { HKD: 1, USD: 1, CNY: 1 }; // 相对 CNY 的汇率（CNY=1）

// 货币符号
const CUR_SYMBOL = { CNY: '¥', HKD: 'HK$', USD: '$' };

// 获取全部汇率（相对 CNY）
async function fetchRates() {
  try {
    const [hkd, usd] = await Promise.all([
      fetch('/api/rate?from=HKD&to=CNY').then(r => r.json()),
      fetch('/api/rate?from=USD&to=CNY').then(r => r.json()),
    ]);
    if (hkd.rate) rates.HKD = hkd.rate;
    if (usd.rate) rates.USD = usd.rate;
    rates.CNY = 1;
  } catch(e) {
    console.warn('汇率获取失败，使用默认值', e);
    rates = { HKD: 0.92, USD: 7.24, CNY: 1 }; // 兜底汇率
  }
}

// 将原始价格（按持仓货币）转换到显示货币
function convertPrice(price, fromCur) {
  if (fromCur === displayCur) return price;
  const inCny = price * rates[fromCur]; // 先换成 CNY
  if (displayCur === 'CNY') return inCny;
  return inCny / rates[displayCur]; // 再换成目标货币
}

// 根据股票代码判断原始货币
function getAssetCurrency(code) {
  if (!code) return 'CNY';
  if (/\.HK$/i.test(code)) return 'HKD';
  // 美股：纯字母或 BRK-B 格式
  if (/^[A-Z]{1,5}(-[A-Z])?$/i.test(code.trim())) return 'USD';
  return 'CNY'; // A股默认人民币
}

function fmtCur(n) {
  return CUR_SYMBOL[displayCur] + fmt(n);
}

// ── 数据库操作 ────────────────────────────────────────
async function loadHoldings() {
  const { data, error } = await sb.from('holdings').select('*').order('created_at');
  if (error) { console.error(error); return []; }
  return data;
}

async function addHolding(entry) {
  const user = await getUser();
  const { error } = await sb.from('holdings').insert({
    user_id:       user.id,
    name:          entry.name,
    code:          entry.code || '',
    type:          entry.type,
    shares:        entry.shares,
    cost_price:    entry.costPrice,
    current_price: entry.currentPrice,
    icon:          HTYPE[entry.type]?.icon || '📈',
    note:          entry.note || '',
  });
  if (error) { console.error(error); return false; }
  return true;
}

async function updateHolding(id, patch) {
  const { error } = await sb.from('holdings').update(patch).eq('id', id);
  if (error) { console.error(error); return false; }
  return true;
}

async function deleteHolding(id) {
  const { error } = await sb.from('holdings').delete().eq('id', id);
  if (error) { console.error(error); return false; }
  return true;
}

// ── 计算 ──────────────────────────────────────────────
function calcHolding(h) {
  const assetCur = getAssetCurrency(h.code);
  const rawMkt   = Number(h.shares) * Number(h.current_price);
  const rawCost  = Number(h.shares) * Number(h.cost_price);
  // 转换到显示货币
  const mktVal   = convertPrice(rawMkt,  assetCur);
  const cost     = convertPrice(rawCost, assetCur);
  const pnl      = mktVal - cost;
  const pct      = cost > 0 ? (pnl / cost * 100) : 0;
  return { mktVal, cost, pnl, pct, assetCur };
}

// ── 渲染汇总 ──────────────────────────────────────────
function renderSummary(holdings) {
  // 所有持仓统一换算成 CNY
  let totalMktCny = 0, totalCostCny = 0;
  holdings.forEach(h => {
    const assetCur = getAssetCurrency(h.code);
    const rawMkt   = Number(h.shares) * Number(h.current_price);
    const rawCost  = Number(h.shares) * Number(h.cost_price);
    totalMktCny  += rawMkt  * rates[assetCur];
    totalCostCny += rawCost * rates[assetCur];
  });

  // 换算三种货币
  const mktHkd = totalMktCny / rates.HKD;
  const mktUsd = totalMktCny / rates.USD;

  // 盈亏（以 CNY 计）
  const totalPnl = totalMktCny - totalCostCny;
  const totalPct = totalCostCny > 0 ? (totalPnl / totalCostCny * 100) : 0;
  const cls = totalPnl > 0 ? 'up' : totalPnl < 0 ? 'down' : 'flat';
  const pnlSign = totalPnl >= 0 ? '+' : '';

  document.getElementById('port-cny').textContent  = '¥'   + fmt(totalMktCny);
  document.getElementById('port-hkd').textContent  = 'HK$' + fmt(mktHkd);
  document.getElementById('port-usd').textContent  = '$'   + fmt(mktUsd);
  document.getElementById('port-cost').textContent = '¥'   + fmt(totalCostCny);
  document.getElementById('port-cost').className   = 'ps-val flat';
  document.getElementById('port-pnl').textContent  = pnlSign + '¥' + fmt(totalPnl);
  document.getElementById('port-pnl').className    = 'ps-val ' + cls;
  document.getElementById('port-pct').textContent  = pnlSign + totalPct.toFixed(2) + '%';
  document.getElementById('port-pct').className    = 'ps-val ' + cls;
}

// ── 渲染列表 ──────────────────────────────────────────
function renderList(holdings) {
  const listEl = document.getElementById('holdings-list');
  const filtered = selectedType === 'all'
    ? holdings
    : holdings.filter(h => h.type === selectedType);

  if (filtered.length === 0) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <div class="empty-text">还没有持仓记录<br>点击「添加持仓」开始记录</div>
      </div>`;
    return;
  }

  listEl.innerHTML = '';
  filtered.forEach(h => {
    const { mktVal, cost, pnl, pct } = calcHolding(h);
    const cfg = HTYPE[h.type] || HTYPE.other;
    const cls = pnl > 0 ? 'up' : pnl < 0 ? 'down' : 'flat';
    const pnlSign = pnl >= 0 ? '+' : '';

    const card = document.createElement('div');
    card.className = 'holding-card';
    card.dataset.id   = h.id;
    card.dataset.code = h.code || '';
    card.innerHTML = `
      <div class="hc-top">
        <div class="hc-icon" style="background:${cfg.bg}">${h.icon}</div>
        <div class="hc-info">
          <div class="hc-name">${h.name}</div>
          <div class="hc-code">${cfg.label}${h.code ? ' · ' + h.code : ''}${h.note ? ' · ' + h.note : ''}<span style="margin-left:4px;opacity:0.5">${getAssetCurrency(h.code)}</span></div>
        </div>
        <div class="hc-mktval">
          <div class="hc-mktval-num" id="mktval-${h.id}">${fmtCur(mktVal)}</div>
          <div class="hc-pnl ${cls}" id="pnl-${h.id}">${pnlSign}${fmtCur(pnl)} (${pnlSign}${pct.toFixed(2)}%)</div>
        </div>
      </div>
      <div class="hc-bottom">
        <div class="hc-detail">
          <div class="hc-detail-label">持仓数量</div>
          <div class="hc-detail-val">${Number(h.shares).toLocaleString()}</div>
        </div>
        <div class="hc-detail">
          <div class="hc-detail-label">成本价</div>
          <div class="hc-detail-val">¥${Number(h.cost_price).toFixed(2)}</div>
        </div>
        <div class="hc-detail">
          <div class="hc-detail-label">现价</div>
          <div class="hc-detail-val" id="price-${h.id}">¥${Number(h.current_price).toFixed(2)}</div>
        </div>
        <div class="hc-detail">
          <div class="hc-detail-label">持仓成本</div>
          <div class="hc-detail-val">${fmtCur(cost)}</div>
        </div>
      </div>`;

    card.addEventListener('click', () => openEdit(h));
    listEl.appendChild(card);
  });
}

// ── 渲染全部 ──────────────────────────────────────────
async function render() {
  allHoldings = await loadHoldings();
  renderSummary(allHoldings);
  renderList(allHoldings);
}

// ── 类型 tab ──────────────────────────────────────────
document.querySelectorAll('.type-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedType = btn.dataset.type;
    renderList(allHoldings);
  });
});

// ── 持仓类型选择 ──────────────────────────────────────
document.querySelectorAll('#htype-grid .htype-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#htype-grid .htype-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedHType = btn.dataset.type;
  });
});

// ── 添加弹窗 ──────────────────────────────────────────
document.getElementById('add-btn').addEventListener('click', () => {
  document.getElementById('input-name').value  = '';
  document.getElementById('input-code').value  = '';
  document.getElementById('input-shares').value = '';
  document.getElementById('input-cost').value  = '';
  document.getElementById('input-price').value = '';
  document.getElementById('input-note').value  = '';
  document.getElementById('modal').classList.add('open');
});

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') document.getElementById('modal').classList.remove('open');
});

document.getElementById('save-btn').addEventListener('click', async () => {
  const name  = document.getElementById('input-name').value.trim();
  const shares = parseFloat(document.getElementById('input-shares').value);
  const cost   = parseFloat(document.getElementById('input-cost').value);
  const price  = parseFloat(document.getElementById('input-price').value);

  if (!name)               { alert('请输入持仓名称'); return; }
  if (isNaN(shares) || shares < 0) { alert('请输入持仓数量'); return; }
  if (isNaN(cost)   || cost < 0)   { alert('请输入成本价'); return; }
  if (isNaN(price)  || price < 0)  { alert('请输入当前价格'); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = '保存中…';

  const ok = await addHolding({
    name, type: selectedHType,
    code:  document.getElementById('input-code').value.trim(),
    note:  document.getElementById('input-note').value.trim(),
    shares, costPrice: cost, currentPrice: price,
  });

  btn.disabled = false; btn.textContent = '保存持仓';
  if (ok) {
    document.getElementById('modal').classList.remove('open');
    await render();
  }
});

// ── 编辑弹窗 ──────────────────────────────────────────
function openEdit(h) {
  document.getElementById('edit-title').textContent = h.name;
  document.getElementById('edit-shares').value = h.shares;
  document.getElementById('edit-cost').value   = h.cost_price;
  document.getElementById('edit-price').value  = h.current_price;
  document.getElementById('edit-note').value   = h.note || '';
  document.getElementById('edit-overlay').dataset.id = h.id;
  document.getElementById('edit-overlay').classList.add('open');
  setTimeout(() => document.getElementById('edit-price').select(), 350);
}

function closeEdit() {
  document.getElementById('edit-overlay').classList.remove('open');
}

document.getElementById('edit-close').addEventListener('click', closeEdit);
document.getElementById('edit-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('edit-overlay')) closeEdit();
});

document.getElementById('edit-save-btn').addEventListener('click', async () => {
  const id     = document.getElementById('edit-overlay').dataset.id;
  const shares = parseFloat(document.getElementById('edit-shares').value);
  const cost   = parseFloat(document.getElementById('edit-cost').value);
  const price  = parseFloat(document.getElementById('edit-price').value);
  const note   = document.getElementById('edit-note').value.trim();

  if (isNaN(shares) || isNaN(cost) || isNaN(price)) { alert('请填写完整数据'); return; }

  const btn = document.getElementById('edit-save-btn');
  btn.disabled = true; btn.textContent = '保存中…';

  const ok = await updateHolding(id, {
    shares, cost_price: cost, current_price: price, note
  });

  btn.disabled = false; btn.textContent = '保存更新';
  if (ok) { closeEdit(); await render(); }
});

document.getElementById('edit-del-btn').addEventListener('click', async () => {
  if (!confirm('确认删除此持仓？')) return;
  const id = document.getElementById('edit-overlay').dataset.id;
  await deleteHolding(id);
  closeEdit();
  await render();
});

// ── 实时价格刷新 ──────────────────────────────────────
async function fetchPrice(symbol) {
  try {
    const res = await fetch('/api/price?symbol=' + encodeURIComponent(symbol));
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

async function refreshPrices() {
  const btn    = document.getElementById('refresh-btn');
  const status = document.getElementById('refresh-status');
  await fetchRates(); // 刷新价格同时更新汇率
  const withCode = allHoldings.filter(h => h.code && h.code.trim());

  if (withCode.length === 0) {
    status.textContent = '没有填写股票代码的持仓，无法自动更新';
    return;
  }

  btn.style.opacity = '0.5';
  btn.disabled = true;
  status.textContent = '更新中…';

  let updated = 0, failed = 0;
  for (const h of withCode) {
    const data = await fetchPrice(h.code.trim());
    if (!data || !data.price) { failed++; continue; }

    // 更新数据库
    await updateHolding(h.id, { current_price: data.price });

    // 实时更新 UI（不重新渲染整个列表）
    const priceEl  = document.getElementById('price-' + h.id);
    const mktvalEl = document.getElementById('mktval-' + h.id);
    const pnlEl    = document.getElementById('pnl-' + h.id);
    if (priceEl) {
      const newMkt  = Number(h.shares) * data.price;
      const cost    = Number(h.shares) * Number(h.cost_price);
      const newPnl  = newMkt - cost;
      const newPct  = cost > 0 ? (newPnl / cost * 100) : 0;
      const cls     = newPnl > 0 ? 'up' : newPnl < 0 ? 'down' : 'flat';
      const sign    = newPnl >= 0 ? '+' : '';
      const chgTxt  = data.changePct >= 0 ? '+' + data.changePct : data.changePct;

      priceEl.textContent  = '¥' + data.price.toFixed(2) + ' (' + chgTxt + '%)';
      priceEl.style.color  = data.change >= 0 ? 'var(--ok)' : 'var(--warn)';
      if (mktvalEl) mktvalEl.textContent = fmt(newMkt);
      if (pnlEl)    { pnlEl.textContent = sign + fmt(newPnl) + ' (' + sign + newPct.toFixed(2) + '%)'; pnlEl.className = 'hc-pnl ' + cls; }
      updated++;
    }
  }

  // 刷新汇总卡
  allHoldings = await loadHoldings();
  renderSummary(allHoldings);

  const now = new Date();
  const timeStr = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
  status.textContent = `已更新 ${updated} 条${failed > 0 ? '，' + failed + ' 条失败' : ''}（${timeStr}）`;
  btn.style.opacity = '1';
  btn.disabled = false;
}

// ── 初始化 ────────────────────────────────────────────
async function init() {
  await requireAuth();
  await fetchRates(); // 预先获取汇率
  await render();


  document.getElementById('refresh-btn').addEventListener('click', refreshPrices);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = '';
}
init();
</script>
