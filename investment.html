<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>财务健康 · 投资持仓</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="base.css">
  <style>
    .portfolio-card {
      margin: 0 24px 16px;
      background: linear-gradient(135deg, #141a10, #0f1a14);
      border-radius: 20px; padding: 20px;
      border: 1px solid rgba(200,240,80,0.2);
    }
    .portfolio-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.05em; }

    .cur-switch { display:flex; gap:6px; margin:8px 0 14px; }
    .cur-sw-btn {
      flex:1; height:28px; border-radius:8px;
      background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
      color:var(--text-muted); font-size:11px; font-weight:600;
      font-family:inherit; cursor:pointer; transition:all 0.15s;
    }
    .cur-sw-btn.active { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }

    .portfolio-total { font-size: 30px; font-weight: 800; color: var(--text); margin-bottom: 14px; }
    .portfolio-row   { display: flex; gap: 8px; }
    .portfolio-stat  { flex: 1; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px; }
    .ps-label { font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
    .ps-val   { font-size: 14px; font-weight: 700; }
    .ps-val.up   { color: var(--ok); }
    .ps-val.down { color: var(--warn); }
    .ps-val.flat { color: var(--text-muted); }

    .type-tabs { display: flex; gap: 6px; padding: 0 24px 14px; overflow-x: auto; scrollbar-width: none; }
    .type-tabs::-webkit-scrollbar { display: none; }
    .type-tab {
      height: 30px; padding: 0 14px; border-radius: 10px; white-space: nowrap;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-muted); font-size: 12px; font-family: inherit;
      cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    }
    .type-tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    .holdings-list { padding: 0 24px; }
    .holding-card {
      background: var(--surface); border-radius: 16px;
      padding: 14px; margin-bottom: 8px;
      border: 1px solid var(--border);
      cursor: pointer; transition: border-color 0.15s, transform 0.12s;
    }
    .holding-card:active { transform: scale(0.98); }
    .holding-card:hover  { border-color: rgba(200,240,80,0.3); }
    .hc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .hc-icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .hc-info { flex: 1; min-width: 0; }
    .hc-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .hc-meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .hc-right { text-align: right; }
    .hc-mktval-num { font-size: 16px; font-weight: 700; color: var(--text); }
    .hc-pnl { font-size: 11px; margin-top: 2px; font-weight: 600; }
    .hc-pnl.up   { color: var(--ok); }
    .hc-pnl.down { color: var(--warn); }
    .hc-pnl.flat { color: var(--text-muted); }
    .hc-bottom { display: flex; border-top: 1px solid var(--border); padding-top: 10px; }
    .hc-detail { flex: 1; text-align: center; }
    .hc-detail-label { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
    .hc-detail-val   { font-size: 12px; font-weight: 500; color: var(--text); }
    .hc-detail + .hc-detail { border-left: 1px solid var(--border); }

    .empty-state { text-align: center; padding: 40px 24px; color: var(--text-muted); }
    .empty-icon  { font-size: 40px; margin-bottom: 12px; }
    .empty-text  { font-size: 14px; line-height: 1.7; }

    .fab-wrap { padding: 0 24px 12px; display: flex; justify-content: flex-end; }
    .add-fab {
      height: 44px; padding: 0 20px; border-radius: 22px; border: none;
      background: var(--accent); color: #0f0f13; font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }

    .modal-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:flex-end;justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { width:375px;background:var(--surface2);border-radius:28px 28px 0 0;padding:0 24px 44px;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);max-height:90vh;overflow-y:auto; }
    .modal-overlay.open .modal { transform:translateY(0); }
    .modal-handle { width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 18px; }
    .modal-title  { font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px; }
    .modal-sub    { font-size:12px;color:var(--text-muted);margin-bottom:20px; }

    .htype-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px; }
    .htype-btn { background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;transition:all 0.15s; }
    .htype-btn.selected { border-color:var(--accent);background:var(--accent-dim); }
    .htype-btn-icon  { font-size:20px; margin-bottom:3px; }
    .htype-btn-label { font-size:10px;color:var(--text-muted); }

    .field { margin-bottom:14px; }
    .field label { display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px; }
    .field input {
      width:100%;height:48px;background:var(--surface);border:1.5px solid var(--border);
      border-radius:12px;padding:0 14px;font-size:15px;font-family:inherit;
      color:var(--text);outline:none;transition:border-color 0.15s;box-sizing:border-box;
    }
    .field input:focus { border-color:var(--accent); }
    .field-row { display:flex;gap:10px; }
    .field-row .field { flex:1; }
    .amount-wrap { position:relative; }
    .amount-prefix { position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px;pointer-events:none; }
    .amount-wrap input { padding-left:26px; }
    .save-btn {
      width:100%;height:52px;border:none;border-radius:16px;
      background:var(--accent);color:#0f0f13;font-size:16px;font-weight:700;
      font-family:inherit;cursor:pointer;margin-top:6px;
    }
    .save-btn:disabled { opacity:0.5;cursor:not-allowed; }

    .edit-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:150;align-items:flex-end;justify-content:center; }
    .edit-overlay.open { display:flex; }
    .edit-sheet { width:375px;background:var(--surface2);border-radius:28px 28px 0 0;padding:0 24px 44px;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);max-height:90vh;overflow-y:auto; }
    .edit-overlay.open .edit-sheet { transform:translateY(0); }
    .edit-handle { width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 8px; }
    .edit-top { display:flex;justify-content:space-between;align-items:center;margin-bottom:16px; }
    .edit-title-text { font-size:17px;font-weight:700;color:var(--text); }
    .edit-close { background:none;border:none;color:var(--text-muted);font-size:22px;cursor:pointer;padding:0; }
    .del-btn {
      width:100%;height:48px;border:1.5px solid var(--warn);border-radius:14px;
      background:transparent;color:var(--warn);font-size:14px;font-weight:600;
      font-family:inherit;cursor:pointer;margin-top:8px;
    }

    .loading-screen { position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:200; }
    .spin { width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-screen p { font-size:13px;color:var(--text-muted); }

    /* ══════════════════════════════════════
       风险雷达模块
    ══════════════════════════════════════ */

    /* 折叠卡 */
    .risk-card {
      margin: 0 20px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px; overflow: hidden;
    }
    .risk-toggle {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; cursor: pointer; user-select: none;
    }
    .risk-toggle-left { display: flex; align-items: center; gap: 8px; }
    .risk-toggle-icon { font-size: 16px; }
    .risk-toggle-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .risk-toggle-score {
      font-size: 11px; font-weight: 700; padding: 3px 9px;
      border-radius: 20px; font-family: var(--font-mono, monospace);
    }
    .risk-toggle-arrow {
      font-size: 12px; color: var(--text-muted);
      transition: transform 0.25s;
    }
    .risk-toggle-arrow.open { transform: rotate(90deg); }
    .risk-body { padding: 0 18px 18px; }

    /* 顶部一行：分数环 + 总结文字 */
    .risk-overview {
      display: flex; align-items: center; gap: 16px; margin-bottom: 18px;
    }
    .risk-ring-wrap {
      width: 72px; height: 72px; position: relative; flex-shrink: 0;
    }
    .risk-ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .risk-ring-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      line-height: 1;
    }
    .risk-score-num { font-size: 22px; font-weight: 800; font-family: var(--font-mono, monospace); }
    .risk-score-sub { font-size: 9px; color: var(--text-muted); margin-top: 2px; }
    .risk-summary {}
    .risk-level-label {
      font-size: 13px; font-weight: 700; margin-bottom: 4px;
    }
    .risk-summary-text { font-size: 11px; color: var(--text-muted); line-height: 1.6; }

    /* 四维度条形 */
    .risk-dims { display: flex; flex-direction: column; gap: 11px; margin-bottom: 18px; }
    .risk-dim-row { display: flex; align-items: center; gap: 10px; }
    .risk-dim-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
    .risk-dim-body { flex: 1; min-width: 0; }
    .risk-dim-top {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 5px;
    }
    .risk-dim-name  { font-size: 11px; color: var(--text); font-weight: 500; }
    .risk-dim-score { font-size: 11px; font-weight: 700; font-family: var(--font-mono, monospace); }
    .risk-dim-bg {
      height: 5px; background: rgba(255,255,255,0.06);
      border-radius: 3px; overflow: hidden;
    }
    .risk-dim-fill {
      height: 100%; border-radius: 3px;
      transition: width 1s cubic-bezier(0.22,1,0.36,1) 0.3s;
    }
    .risk-dim-hint { font-size: 10px; color: var(--text-muted); margin-top: 3px; }

    /* 集中度明细 */
    .risk-section-title {
      font-size: 10px; font-weight: 600; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--text-muted);
      margin-bottom: 10px;
    }
    .conc-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .conc-name { font-size: 11px; color: var(--text); min-width: 64px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conc-bar-wrap { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
    .conc-bar-fill { height: 100%; border-radius: 3px; transition: width 1s cubic-bezier(0.22,1,0.36,1) 0.5s; }
    .conc-pct { font-size: 11px; font-weight: 700; font-family: var(--font-mono, monospace); min-width: 34px; text-align: right; }

    /* 市场分布 */
    .market-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 18px; }
    .market-tile {
      background: var(--surface2, #131318); border-radius: 14px;
      padding: 10px 12px; text-align: center;
      border: 1px solid var(--border);
    }
    .market-flag  { font-size: 18px; margin-bottom: 4px; }
    .market-name  { font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
    .market-pct   { font-size: 15px; font-weight: 800; font-family: var(--font-mono, monospace); }

    /* 压力测试 */
    .stress-block {
      background: rgba(255,107,107,0.05);
      border: 1px solid rgba(255,107,107,0.13);
      border-radius: 16px; padding: 14px 16px;
    }
    .stress-block-title {
      font-size: 10px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--warn); margin-bottom: 12px; opacity: 0.85;
    }
    .stress-scenario {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; padding: 11px 13px;
      margin-bottom: 8px; cursor: pointer;
      transition: border-color 0.15s;
    }
    .stress-scenario:last-child { margin-bottom: 0; }
    .stress-scenario:hover { border-color: rgba(255,107,107,0.3); }
    .stress-scenario-header { display: flex; justify-content: space-between; align-items: center; }
    .stress-scenario-left {}
    .stress-scenario-year { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; letter-spacing: 0.04em; }
    .stress-scenario-name { font-size: 12px; font-weight: 600; color: var(--text); }
    .stress-scenario-right { text-align: right; }
    .stress-scenario-loss { font-size: 14px; font-weight: 800; font-family: var(--font-mono, monospace); }
    .stress-scenario-pct  { font-size: 10px; margin-top: 1px; }
    /* 展开详情 */
    .stress-detail {
      display: none; margin-top: 10px;
      padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06);
    }
    .stress-detail.open { display: block; }
    .stress-detail-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .stress-detail-row:last-child { margin-bottom: 0; }
    .stress-detail-name { font-size: 10px; color: var(--text-muted); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stress-detail-val  { font-size: 10px; font-weight: 700; font-family: var(--font-mono, monospace); color: var(--warn); }
    .stress-detail-val.mild { color: var(--mid); }
    .stress-desc { font-size: 10px; color: var(--text-muted); line-height: 1.6; margin-top: 8px; opacity: 0.8; }
  </style>
</head>
<body>
<div class="loading-screen" id="loading"><div class="spin"></div><p>加载中…</p></div>

<div class="phone" id="app" style="display:none">
  <div class="status-bar">
    <span class="status-time" id="clock">9:41</span>
    <div class="status-icons"><svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="2.5" stroke="white" stroke-width="1.2" fill="none" opacity="0.8"/><rect x="1.5" y="2.5" width="16" height="7" rx="1.5" fill="white"/><rect x="23" y="4" width="2" height="4" rx="1" fill="white" opacity="0.5"/></svg></div>
  </div>

  <div class="screen-content">
    <div class="page-header">
      <div class="page-title">投资持仓</div>
      <div class="page-sub">证券账户明细</div>
    </div>

    <div class="portfolio-card">
      <div class="portfolio-label">持仓总市值</div>
      <div class="cur-switch">
        <button class="cur-sw-btn" data-cur="CNY">¥ 人民币</button>
        <button class="cur-sw-btn" data-cur="HKD">HK$ 港元</button>
        <button class="cur-sw-btn active" data-cur="USD">$ 美元</button>
      </div>
      <div class="portfolio-total" id="port-total">—</div>
      <div class="portfolio-row">
        <div class="portfolio-stat">
          <div class="ps-label">总成本</div>
          <div class="ps-val flat" id="port-cost">—</div>
        </div>
        <div class="portfolio-stat">
          <div class="ps-label">浮动盈亏</div>
          <div class="ps-val flat" id="port-pnl">—</div>
        </div>
        <div class="portfolio-stat">
          <div class="ps-label">总收益率</div>
          <div class="ps-val flat" id="port-pct">—</div>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 24px 12px;">
      <div id="refresh-status" style="font-size:11px;color:var(--text-muted)">点击右侧按钮更新最新价格</div>
      <button id="refresh-btn" style="height:32px;padding:0 14px;border-radius:10px;border:1px solid rgba(200,240,80,0.3);background:rgba(200,240,80,0.1);color:var(--accent);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;">🔄 刷新价格</button>
    </div>

    <!-- ══ 风险雷达 ══ -->
    <div class="risk-card" id="risk-card">
      <div class="risk-toggle" id="risk-toggle">
        <div class="risk-toggle-left">
          <span class="risk-toggle-icon">🛡️</span>
          <span class="risk-toggle-title">持仓风险雷达</span>
          <span class="risk-toggle-score" id="risk-badge">—</span>
        </div>
        <span class="risk-toggle-arrow open" id="risk-arrow">›</span>
      </div>
      <div class="risk-body" id="risk-body">
        <div class="risk-overview">
          <div class="risk-ring-wrap">
            <svg viewBox="0 0 72 72">
              <circle fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="6" cx="36" cy="36" r="28"/>
              <circle fill="none" stroke-width="6" stroke-linecap="round"
                cx="36" cy="36" r="28" id="risk-ring-circle"
                stroke-dasharray="175.9" stroke-dashoffset="175.9"
                style="transition:stroke-dashoffset 1.2s cubic-bezier(0.22,1,0.36,1) 0.2s;stroke:var(--ok)"/>
            </svg>
            <div class="risk-ring-center">
              <span class="risk-score-num" id="risk-score-num">—</span>
              <span class="risk-score-sub">/100</span>
            </div>
          </div>
          <div class="risk-summary">
            <div class="risk-level-label" id="risk-level-label">—</div>
            <div class="risk-summary-text" id="risk-summary-text">—</div>
          </div>
        </div>
        <div class="risk-dims" id="risk-dims"></div>
        <div class="risk-section-title">持仓集中度</div>
        <div id="conc-list" style="margin-bottom:18px"></div>
        <div class="risk-section-title">市场分布</div>
        <div class="market-grid" id="market-grid" style="margin-bottom:18px"></div>
        <div class="stress-block">
          <div class="stress-block-title">📉 历史情景压力测试</div>
          <div id="stress-scenarios"></div>
        </div>
      </div>
    </div>

    <div class="type-tabs">
      <button class="type-tab active" data-type="all">全部</button>
      <button class="type-tab" data-type="stock">股票</button>
      <button class="type-tab" data-type="fund">基金</button>
      <button class="type-tab" data-type="bond">债券</button>
      <button class="type-tab" data-type="crypto">加密</button>
      <button class="type-tab" data-type="other">其他</button>
    </div>

    <div class="fab-wrap">
      <button class="add-fab" id="add-btn">＋ 添加持仓</button>
    </div>

    <div class="holdings-list" id="holdings-list"></div>
  </div>

  <nav class="nav-bar">
    <a href="index.html" class="nav-item"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="2" y="10" width="8" height="10" rx="2" fill="currentColor"/><rect x="12" y="2" width="8" height="18" rx="2" fill="currentColor" opacity="0.6"/></svg><span>总览</span></a>
    <a href="assets.html" class="nav-item active"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="2" y="2" width="9" height="9" rx="2.5" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="2" width="7" height="9" rx="2.5" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="13" width="7" height="7" rx="2.5" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="13" width="7" height="7" rx="2.5" stroke="currentColor" stroke-width="1.5"/></svg><span>资产</span></a>
    <a href="cashflow.html" class="nav-item"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 11h14M4 7l4-4 4 4M18 15l-4 4-4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>收支</span></a>
    <a href="diagnosis.html" class="nav-item"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8.5" stroke="currentColor" stroke-width="1.5"/><path d="M11 6v5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>诊断</span></a>
    <a href="goals.html" class="nav-item"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8.5" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="11" r="4" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="11" r="1.5" fill="currentColor"/></svg><span>目标</span></a>
  </nav>
</div>

<!-- 添加持仓弹窗 -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">

<script>
// 时钟
function updateClock() {
  const n = new Date();
  document.getElementById('clock').textContent = n.getHours() + ':' + String(n.getMinutes()).padStart(2,'0');
}
updateClock(); setInterval(updateClock, 10000);

// 类型配置
const HTYPE = {
  stock:  { label:'股票',    icon:'📊', bg:'rgba(200,240,80,0.12)' },
  fund:   { label:'基金',    icon:'📦', bg:'rgba(96,208,240,0.12)' },
  bond:   { label:'债券',    icon:'🏦', bg:'rgba(240,184,76,0.12)' },
  crypto: { label:'加密货币', icon:'🪙', bg:'rgba(255,107,107,0.12)' },
  other:  { label:'其他',    icon:'💼', bg:'rgba(160,160,200,0.12)' },
};

// 全局状态
let allHoldings  = [];
let selectedType = 'all';
let addHType     = 'stock';
let displayCur   = 'USD';
// 汇率：1单位外币 = X 人民币（CNY基准=1）
let rates        = { CNY:1, HKD:0.92, USD:7.24 };

const CUR_SYM = { CNY:'¥', HKD:'HK$', USD:'$' };

// 根据代码判断原始货币
function getOriginalCur(code) {
  if (!code) return 'CNY';
  const c = code.trim().toUpperCase();
  if (/\.HK$/.test(c)) return 'HKD';
  if (/^[A-Z]{1,5}$/.test(c)) return 'USD';
  if (/^[A-Z]{1,4}[-\.][A-Z]{1,2}$/.test(c)) return 'USD';
  return 'CNY';
}

// 金额换算（原始货币 → 显示货币）
function toDisp(amount, fromCur) {
  return amount * rates[fromCur] / rates[displayCur];
}

// 纯数字格式（不含货币符号），供多币种显示使用
function fmtN(n) {
  if (Math.abs(n) >= 10000) return (n / 10000).toFixed(1) + '万';
  return Number(n).toLocaleString(undefined, {minimumFractionDigits:0, maximumFractionDigits:2});
}
function fmtD(n) { return CUR_SYM[displayCur] + fmtN(n); }
function fmtOrig(n, cur) { return CUR_SYM[cur] + fmtN(n); }

// 汇率获取
async function fetchRates() {
  try {
    const [hkd, usd] = await Promise.all([
      fetch('/api/rate?from=HKD&to=CNY').then(r => r.json()),
      fetch('/api/rate?from=USD&to=CNY').then(r => r.json()),
    ]);
    if (hkd.rate) rates.HKD = hkd.rate;
    if (usd.rate) rates.USD = usd.rate;
    // 缓存汇率供其他页面使用
    try { sessionStorage.setItem('fx_rates', JSON.stringify(rates)); } catch(e) {}
  } catch(e) { console.warn('汇率获取失败，使用兜底值'); }
}

// 数据库
async function loadHoldings() {
  const { data, error } = await sb.from('holdings').select('*').order('created_at');
  if (error) { console.error(error); return []; }
  return data || [];
}
async function addHoldingDB(d) {
  const user = await getUser();
  const { error } = await sb.from('holdings').insert({
    user_id:user.id, name:d.name, code:d.code||'', type:d.type,
    shares:d.shares, cost_price:d.costPrice, current_price:d.currentPrice,
    icon:HTYPE[d.type]?.icon||'📈', note:d.note||'',
  });
  return !error;
}
async function updateHoldingDB(id, patch) {
  const { error } = await sb.from('holdings').update(patch).eq('id', id);
  return !error;
}
async function deleteHoldingDB(id) {
  const { error } = await sb.from('holdings').delete().eq('id', id);
  return !error;
}

// 渲染汇总
function renderSummary(list) {
  let mktCny=0, costCny=0;
  list.forEach(h => {
    const r = rates[getOriginalCur(h.code)];
    mktCny  += Number(h.shares) * Number(h.current_price) * r;
    costCny += Number(h.shares) * Number(h.cost_price)    * r;
  });
  const mkt  = mktCny  / rates[displayCur];
  const cost = costCny / rates[displayCur];
  const pnl  = mkt - cost;
  const pct  = cost > 0 ? pnl/cost*100 : 0;
  const cls  = pnl>0?'up':pnl<0?'down':'flat';
  const sign = pnl>=0?'+':'';

  document.getElementById('port-total').textContent = fmtD(mkt);
  document.getElementById('port-cost').textContent  = fmtD(cost);
  document.getElementById('port-cost').className    = 'ps-val flat';
  document.getElementById('port-pnl').textContent   = sign+fmtD(pnl);
  document.getElementById('port-pnl').className     = 'ps-val '+cls;
  document.getElementById('port-pct').textContent   = sign+pct.toFixed(2)+'%';
  document.getElementById('port-pct').className     = 'ps-val '+cls;
}

// 渲染列表
function renderList(list) {
  const el = document.getElementById('holdings-list');
  const filtered = selectedType==='all' ? list : list.filter(h => h.type===selectedType);

  if (!filtered.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">还没有持仓记录<br>点击「添加持仓」开始记录</div></div>`;
    return;
  }

  el.innerHTML = '';
  filtered.forEach(h => {
    const origCur = getOriginalCur(h.code);
    const mktVal  = toDisp(Number(h.shares)*Number(h.current_price), origCur);
    const costVal = toDisp(Number(h.shares)*Number(h.cost_price),    origCur);
    const pnl     = mktVal - costVal;
    const pct     = costVal>0 ? pnl/costVal*100 : 0;
    const cfg     = HTYPE[h.type]||HTYPE.other;
    const cls     = pnl>0?'up':pnl<0?'down':'flat';
    const sign    = pnl>=0?'+':'';

    const card = document.createElement('div');
    card.className = 'holding-card';
    card.innerHTML = `
      <div class="hc-top">
        <div class="hc-icon" style="background:${cfg.bg}">${h.icon}</div>
        <div class="hc-info">
          <div class="hc-name">${h.name}</div>
          <div class="hc-meta">${cfg.label}${h.code?' · '+h.code:''} <span style="opacity:0.45">${origCur}</span>${h.note?' · '+h.note:''}</div>
        </div>
        <div class="hc-right">
          <div class="hc-mktval-num" id="mv-${h.id}">${fmtD(mktVal)}</div>
          <div class="hc-pnl ${cls}" id="pl-${h.id}">${sign}${fmtD(pnl)} (${sign}${pct.toFixed(2)}%)</div>
        </div>
      </div>
      <div class="hc-bottom">
        <div class="hc-detail"><div class="hc-detail-label">持仓数量</div><div class="hc-detail-val">${Number(h.shares).toLocaleString()}</div></div>
        <div class="hc-detail"><div class="hc-detail-label">成本价</div><div class="hc-detail-val">${Number(h.cost_price).toFixed(2)}</div></div>
        <div class="hc-detail"><div class="hc-detail-label">现价</div><div class="hc-detail-val" id="px-${h.id}">${Number(h.current_price).toFixed(2)}</div></div>
        <div class="hc-detail"><div class="hc-detail-label">持仓成本</div><div class="hc-detail-val">${fmtOrig(Number(h.shares)*Number(h.cost_price), origCur)}</div></div>
      </div>`;
    card.addEventListener('click', () => openEdit(h));
    el.appendChild(card);
  });
}

async function render() {
  allHoldings = await loadHoldings();
  renderSummary(allHoldings);
  renderList(allHoldings);
  renderRisk(allHoldings);
  syncToAssets();
}

// ══════════════════════════════════════════════════════
// 风险雷达引擎
// ══════════════════════════════════════════════════════
function renderRisk(list) {
  if (!list.length) {
    document.getElementById('risk-badge').textContent = '无数据';
    document.getElementById('risk-badge').style.cssText = 'background:rgba(255,255,255,0.06);color:var(--text-muted)';
    document.getElementById('risk-score-num').textContent = '—';
    document.getElementById('risk-level-label').textContent = '暂无数据';
    document.getElementById('risk-summary-text').textContent = '添加持仓后自动生成风险分析';
    document.getElementById('risk-dims').innerHTML = '';
    document.getElementById('conc-list').innerHTML = '';
    document.getElementById('market-grid').innerHTML = '';
    document.getElementById('stress-scenarios').innerHTML = '';
    return;
  }

  // ── 计算每只持仓的市值（CNY）──────────────────────────
  const items = list.map(h => {
    const origCur = getOriginalCur(h.code);
    const mktCny  = Number(h.shares) * Number(h.current_price) * rates[origCur];
    const costCny = Number(h.shares) * Number(h.cost_price)    * rates[origCur];
    const market  = origCur === 'HKD' ? 'HK' : origCur === 'USD' ? 'US' : 'CN';
    return { ...h, mktCny, costCny, market, origCur };
  });
  const totalMktCny = items.reduce((s, h) => s + h.mktCny, 0) || 1;

  // ── 1. 集中度分 ─────────────────────────────────────
  const weights = items.map(h => h.mktCny / totalMktCny * 100);
  const maxWeight = Math.max(...weights);
  const concScore =
    maxWeight < 15 ? 100 :
    maxWeight < 20 ? 85  :
    maxWeight < 30 ? 65  :
    maxWeight < 50 ? 40  : 15;
  const concHint =
    maxWeight < 20 ? '单只持仓集中度良好' :
    maxWeight < 30 ? `最大持仓 ${maxWeight.toFixed(0)}%，略偏集中` :
    maxWeight < 50 ? `最大持仓 ${maxWeight.toFixed(0)}%，集中度偏高` :
                     `最大持仓 ${maxWeight.toFixed(0)}%，高度集中，风险较大`;

  // ── 2. 分散化分 ─────────────────────────────────────
  const typeSet   = new Set(items.map(h => h.type));
  const marketSet = new Set(items.map(h => h.market));
  const typeCount = typeSet.size;
  const mktCount  = marketSet.size;
  const divScore  = Math.min(100,
    typeCount  * 20 +   // 每种类型 +20
    mktCount   * 25 +   // 每个市场 +25
    (items.length >= 5 ? 15 : items.length * 3) // 持仓数量加成
  );
  const divHint =
    divScore >= 75 ? `${typeCount} 类资产 · ${mktCount} 个市场，分散充分` :
    divScore >= 50 ? `可适当增加资产类型或跨市场配置` :
                     `持仓较单一，建议分散到不同类型/市场`;

  // ── 3. 市场暴露分 ────────────────────────────────────
  const mktPct = { CN:0, HK:0, US:0 };
  items.forEach(h => { mktPct[h.market] = (mktPct[h.market]||0) + h.mktCny/totalMktCny*100; });
  const maxMktPct = Math.max(...Object.values(mktPct));
  const mktScore =
    maxMktPct < 50 ? 100 :
    maxMktPct < 70 ? 80  :
    maxMktPct < 85 ? 55  : 30;
  const mktHint =
    maxMktPct < 60 ? '市场分布较均衡' :
    maxMktPct < 80 ? `单一市场占比 ${maxMktPct.toFixed(0)}%，可适当分散` :
                     `单一市场占比 ${maxMktPct.toFixed(0)}%，地区风险集中`;

  // ── 4. 盈亏健康分 ────────────────────────────────────
  const profitItems = items.filter(h => h.mktCny >= h.costCny);
  const profitMktVal = profitItems.reduce((s, h) => s + h.mktCny, 0);
  const profitPct    = profitMktVal / totalMktCny * 100;
  const totalPnlPct  = (totalMktCny - items.reduce((s,h)=>s+h.costCny,0))
                        / (items.reduce((s,h)=>s+h.costCny,0)||1) * 100;
  const pnlScore =
    totalPnlPct > 15  ? 100 :
    totalPnlPct > 5   ? 85  :
    totalPnlPct > 0   ? 65  :
    totalPnlPct > -10 ? 45  :
    totalPnlPct > -20 ? 25  : 10;
  const pnlHint =
    totalPnlPct > 10  ? `整体盈利 ${totalPnlPct.toFixed(1)}%，持仓健康` :
    totalPnlPct > 0   ? `整体小幅盈利 ${totalPnlPct.toFixed(1)}%` :
    totalPnlPct > -15 ? `整体浮亏 ${Math.abs(totalPnlPct).toFixed(1)}%，留意风险` :
                        `整体浮亏 ${Math.abs(totalPnlPct).toFixed(1)}%，建议检视持仓`;

  // ── 综合风险分（越高越健康）──────────────────────────
  const overall = Math.round(
    concScore * 0.30 +
    divScore  * 0.25 +
    mktScore  * 0.20 +
    pnlScore  * 0.25
  );

  // ── 风险等级 ────────────────────────────────────────
  const levelInfo =
    overall >= 80 ? { label:'风险较低 🟢', color:'var(--ok)',  summary:'持仓结构健康，各维度表现良好。' } :
    overall >= 60 ? { label:'风险适中 🟡', color:'var(--mid)', summary:'整体风险可控，部分维度有优化空间。' } :
    overall >= 40 ? { label:'风险偏高 🟠', color:'var(--mid)', summary:'存在一定集中或暴露风险，建议优化配置。' } :
                    { label:'风险较高 🔴', color:'var(--warn)', summary:'持仓风险集中，建议尽快检视并分散风险。' };

  // ── 渲染综合分 ───────────────────────────────────────
  document.getElementById('risk-score-num').textContent = overall;
  document.getElementById('risk-score-num').style.color = levelInfo.color;
  document.getElementById('risk-ring-circle').style.stroke = levelInfo.color;
  document.getElementById('risk-ring-circle').style.strokeDashoffset =
    (175.9 * (1 - overall/100)).toFixed(1);
  document.getElementById('risk-level-label').textContent  = levelInfo.label;
  document.getElementById('risk-level-label').style.color  = levelInfo.color;
  document.getElementById('risk-summary-text').textContent = levelInfo.summary;
  document.getElementById('risk-badge').textContent = overall + ' 分';
  document.getElementById('risk-badge').style.cssText =
    `background:${levelInfo.color.replace('var(','').replace(')','').trim()};` +
    (overall >= 60
      ? `background:${levelInfo.color === 'var(--ok)' ? 'rgba(92,240,176,0.12)' : 'rgba(240,184,76,0.12)'};color:${levelInfo.color}`
      : `background:rgba(255,107,107,0.12);color:var(--warn)`);

  // ── 渲染四维度 ───────────────────────────────────────
  const dims = [
    { icon:'🎯', name:'集中度控制', score:concScore, hint:concHint, color: concScore>=80?'var(--ok)':concScore>=50?'var(--mid)':'var(--warn)' },
    { icon:'🌐', name:'分散化程度', score:divScore,  hint:divHint,  color: divScore>=75?'var(--ok)':divScore>=50?'var(--mid)':'var(--warn)' },
    { icon:'🗺️', name:'市场暴露',   score:mktScore,  hint:mktHint,  color: mktScore>=80?'var(--ok)':mktScore>=55?'var(--mid)':'var(--warn)' },
    { icon:'📈', name:'盈亏健康',   score:pnlScore,  hint:pnlHint,  color: pnlScore>=80?'var(--ok)':pnlScore>=50?'var(--mid)':'var(--warn)' },
  ];
  document.getElementById('risk-dims').innerHTML = dims.map(d => `
    <div class="risk-dim-row">
      <span class="risk-dim-icon">${d.icon}</span>
      <div class="risk-dim-body">
        <div class="risk-dim-top">
          <span class="risk-dim-name">${d.name}</span>
          <span class="risk-dim-score" style="color:${d.color}">${d.score}</span>
        </div>
        <div class="risk-dim-bg">
          <div class="risk-dim-fill" style="width:${d.score}%;background:${d.color};opacity:0.8"></div>
        </div>
        <div class="risk-dim-hint">${d.hint}</div>
      </div>
    </div>`).join('');

  // ── 集中度明细 ───────────────────────────────────────
  const sorted = [...items].sort((a,b) => b.mktCny - a.mktCny).slice(0, 8);
  document.getElementById('conc-list').innerHTML = sorted.map(h => {
    const w = h.mktCny / totalMktCny * 100;
    const barColor = w > 30 ? 'var(--warn)' : w > 20 ? 'var(--mid)' : 'var(--ok)';
    return `
      <div class="conc-row">
        <span class="conc-name">${h.name}</span>
        <div class="conc-bar-wrap">
          <div class="conc-bar-fill" style="width:${w}%;background:${barColor};opacity:0.75"></div>
        </div>
        <span class="conc-pct" style="color:${barColor}">${w.toFixed(1)}%</span>
      </div>`;
  }).join('');

  // ── 市场分布 ─────────────────────────────────────────
  const mkts = [
    { key:'CN', flag:'🇨🇳', name:'A 股' },
    { key:'HK', flag:'🇭🇰', name:'港股' },
    { key:'US', flag:'🇺🇸', name:'美股' },
  ];
  document.getElementById('market-grid').innerHTML = mkts.map(m => {
    const pct = mktPct[m.key] || 0;
    const color = pct > 80 ? 'var(--warn)' : pct > 60 ? 'var(--mid)' : pct > 0 ? 'var(--text)' : 'var(--text-muted)';
    return `
      <div class="market-tile">
        <div class="market-flag">${m.flag}</div>
        <div class="market-name">${m.name}</div>
        <div class="market-pct" style="color:${color}">${pct.toFixed(0)}%</div>
      </div>`;
  }).join('');

  // ── 历史情景压力测试 ─────────────────────────────────
  //
  // 数据来源：各主要指数历史峰值→谷底最大回撤
  // 按「市场(CN/HK/US) × 资产类型(stock/fund/bond/crypto)」差异化跌幅
  //
  const SCENARIOS = [
    {
      id: 'gfc2008', year: '2008', name: '全球金融危机',
      desc: '雷曼兄弟破产引发系统性危机，全球股市腰斩。A股在2007年高位已开始下跌，港股恒指跌幅超60%，S&P 500跌57%。债券因避险大幅上涨。',
      drawdown: {
        CN: { stock:0.62, fund:0.50, bond:-0.05, crypto:0.00, other:0.40 },
        HK: { stock:0.65, fund:0.52, bond:-0.04, crypto:0.00, other:0.45 },
        US: { stock:0.57, fund:0.48, bond:-0.06, crypto:0.00, other:0.38 },
      }
    },
    {
      id: 'cn2015', year: '2015', name: 'A股股灾',

      drawdown: {

        HK: { stock:0.30, fund:0.25, bond: 0.01, crypto:0.25, other:0.20 },

      }
    },
    {
      id: 'covid2020', year: '2020', name: 'COVID 暴跌',
      desc: '疫情恐慌引发全球流动性危机，S&P 500用33天创最快熊市纪录，跌34%。BTC单日暴跌50%，A股因较早经历疫情跌幅相对较小仅16%。',
      drawdown: {
        CN: { stock:0.16, fund:0.14, bond:-0.03, crypto:0.63, other:0.12 },
        HK: { stock:0.26, fund:0.22, bond:-0.02, crypto:0.63, other:0.18 },
        US: { stock:0.34, fund:0.28, bond: 0.01, crypto:0.63, other:0.22 },
      }
    },
    {
      id: 'tradewar2018', year: '2018', name: '中美贸易战',
      desc: '中美贸易摩擦持续升级，A股全年跌25%，港股跌13%，美股受企业盈利支撑跌幅有限。BTC经历加密寒冬全年下跌约80%。',
      drawdown: {
        CN: { stock:0.25, fund:0.20, bond: 0.01, crypto:0.80, other:0.18 },
        HK: { stock:0.13, fund:0.11, bond: 0.00, crypto:0.80, other:0.10 },
        US: { stock:0.06, fund:0.05, bond: 0.01, crypto:0.80, other:0.04 },
      }
    },
    {
      id: 'ratehike2022', year: '2022', name: '美联储激进加息',
      desc: '美联储全年加息425bp，纳斯达克跌33%，港股恒指跌40%触及十年低点。债券遭遇历史最差年份，10年期美债跌逾15%。BTC下跌65%，FTX暴雷加剧恐慌。',
      drawdown: {
        CN: { stock:0.22, fund:0.18, bond: 0.05, crypto:0.65, other:0.15 },
        HK: { stock:0.40, fund:0.34, bond: 0.08, crypto:0.65, other:0.28 },
        US: { stock:0.25, fund:0.20, bond: 0.15, crypto:0.65, other:0.18 },
      }
    },
    {
      id: 'eurocrisis2011', year: '2011', name: '欧债危机',
      desc: '希腊等国债务危机蔓延，欧洲银行体系承压。港股跌28%，美股接近熊市边缘（-19%），美债等避险资产受益大涨，A股独立下跌约22%。',
      drawdown: {
        CN: { stock:0.22, fund:0.18, bond:-0.02, crypto:0.00, other:0.15 },
        HK: { stock:0.28, fund:0.23, bond:-0.03, crypto:0.00, other:0.18 },
        US: { stock:0.19, fund:0.16, bond:-0.05, crypto:0.00, other:0.12 },
      }
    },
  ];

  // 计算每个场景下的持仓损失
  const stressResults = SCENARIOS.map(sc => {
    let totalLossCny = 0;
    const itemBreakdown = [];
    items.forEach(h => {
      const mkt     = h.market;
      const tp      = h.type;
      const mktData = sc.drawdown[mkt] || sc.drawdown['US'];
      const drop    = (mktData[tp] !== undefined) ? mktData[tp] : mktData['stock'];
      if (drop <= 0) return;
      const lossCny = h.mktCny * drop;
      totalLossCny += lossCny;
      itemBreakdown.push({ name: h.name, lossCny, drop, market: mkt, type: tp });
    });
    const lossDisp = totalLossCny / rates[displayCur];
    const lossPct  = totalLossCny / totalMktCny * 100;
    itemBreakdown.sort((a, b) => b.lossCny - a.lossCny);
    return { ...sc, lossDisp, lossPct, itemBreakdown };
  });

  // 按损失比例从大到小排序
  stressResults.sort((a, b) => b.lossPct - a.lossPct);

  const stressEl = document.getElementById('stress-scenarios');
  stressEl.innerHTML = stressResults.map(sc => {
    const lossColor = sc.lossPct >= 25 ? 'var(--warn)' : sc.lossPct >= 12 ? 'var(--mid)' : 'var(--text-muted)';
    const breakdown = sc.itemBreakdown.slice(0, 5).map(b => `
      <div class="stress-detail-row">
        <span class="stress-detail-name">${b.name}
          <span style="opacity:0.5">${b.market} · -${(b.drop*100).toFixed(0)}%</span>
        </span>
        <span class="stress-detail-val ${b.drop < 0.12 ? 'mild' : ''}">
          -${fmtD(b.lossCny / rates[displayCur])}
        </span>
      </div>`).join('');
    return `
      <div class="stress-scenario" onclick="this.querySelector('.stress-detail').classList.toggle('open')">
        <div class="stress-scenario-header">
          <div class="stress-scenario-left">
            <div class="stress-scenario-year">${sc.year}</div>
            <div class="stress-scenario-name">${sc.name}</div>
          </div>
          <div class="stress-scenario-right">
            <div class="stress-scenario-loss" style="color:${lossColor}">-${fmtD(sc.lossDisp)}</div>
            <div class="stress-scenario-pct"  style="color:${lossColor}">约 -${sc.lossPct.toFixed(1)}% 市值</div>
          </div>
        </div>
        <div class="stress-detail">
          <div class="stress-desc">${sc.desc}</div>
          ${sc.itemBreakdown.length > 0 ? `
            <div style="margin-top:10px;margin-bottom:6px;font-size:10px;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase">主要损失来源</div>
            ${breakdown}` : ''}
        </div>
      </div>`;
  }).join('');
}

function syncToAssets() {
  let totalCny = 0;
  allHoldings.forEach(h => {
    const r = rates[getOriginalCur(h.code)] || 1;
    totalCny += Number(h.shares) * Number(h.current_price) * r;
  });
  if (totalCny > 0) dbSyncHoldingsAsset(totalCny);
}

// 风险雷达折叠
document.getElementById('risk-toggle').addEventListener('click', () => {
  const body  = document.getElementById('risk-body');
  const arrow = document.getElementById('risk-arrow');
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : '';
  arrow.classList.toggle('open', !isOpen);
});

// 货币切换
document.querySelectorAll('.cur-sw-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cur-sw-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    displayCur = btn.dataset.cur;
    renderSummary(allHoldings);
    renderList(allHoldings);
  });
});

// 分类筛选
document.querySelectorAll('.type-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedType = btn.dataset.type;
    renderList(allHoldings);
  });
});

// 添加持仓
document.getElementById('add-btn').addEventListener('click', () => {
  ['add-name','add-code','add-shares','add-cost','add-price','add-note'].forEach(id =>
    document.getElementById(id).value = '');
  document.getElementById('add-modal').classList.add('open');
});
document.getElementById('add-modal').addEventListener('click', e => {
  if (e.target.id==='add-modal') document.getElementById('add-modal').classList.remove('open');
});
document.querySelectorAll('#htype-grid .htype-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#htype-grid .htype-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    addHType = btn.dataset.type;
  });
});
document.getElementById('add-save-btn').addEventListener('click', async () => {
  const name   = document.getElementById('add-name').value.trim();
  const code   = document.getElementById('add-code').value.trim();
  const shares = parseFloat(document.getElementById('add-shares').value);
  const cost   = parseFloat(document.getElementById('add-cost').value);
  const price  = parseFloat(document.getElementById('add-price').value);
  const note   = document.getElementById('add-note').value.trim();

  if (!name)                       { alert('请输入持仓名称'); return; }
  if (isNaN(shares)||shares<0)     { alert('请输入持仓数量'); return; }
  if (isNaN(cost)  ||cost<0)       { alert('请输入成本价'); return; }
  if (isNaN(price) ||price<0)      { alert('请输入当前价格'); return; }

  const btn = document.getElementById('add-save-btn');
  btn.disabled=true; btn.textContent='保存中…';
  const ok = await addHoldingDB({name,code,type:addHType,shares,costPrice:cost,currentPrice:price,note});
  btn.disabled=false; btn.textContent='保存持仓';
  if (ok) { document.getElementById('add-modal').classList.remove('open'); await render(); }
});

// 编辑持仓
function openEdit(h) {
  document.getElementById('edit-title').textContent = h.name;
  document.getElementById('edit-code').value   = h.code||'';
  document.getElementById('edit-shares').value = h.shares;
  document.getElementById('edit-cost').value   = h.cost_price;
  document.getElementById('edit-price').value  = h.current_price;
  document.getElementById('edit-note').value   = h.note||'';
  document.getElementById('edit-overlay').dataset.id = h.id;
  document.getElementById('edit-overlay').classList.add('open');
}
function closeEdit() { document.getElementById('edit-overlay').classList.remove('open'); }
document.getElementById('edit-close').addEventListener('click', closeEdit);
document.getElementById('edit-overlay').addEventListener('click', e => {
  if (e.target.id==='edit-overlay') closeEdit();
});
document.getElementById('edit-save-btn').addEventListener('click', async () => {
  const id     = document.getElementById('edit-overlay').dataset.id;
  const code   = document.getElementById('edit-code').value.trim();
  const shares = parseFloat(document.getElementById('edit-shares').value);
  const cost   = parseFloat(document.getElementById('edit-cost').value);
  const price  = parseFloat(document.getElementById('edit-price').value);
  const note   = document.getElementById('edit-note').value.trim();

  if (isNaN(shares)||isNaN(cost)||isNaN(price)) { alert('请填写完整数据'); return; }
  const btn = document.getElementById('edit-save-btn');
  btn.disabled=true; btn.textContent='保存中…';
  const ok = await updateHoldingDB(id, {code, shares, cost_price:cost, current_price:price, note});
  btn.disabled=false; btn.textContent='保存更新';
  if (ok) { closeEdit(); await render(); }
});
document.getElementById('edit-del-btn').addEventListener('click', async () => {
  if (!confirm('确认删除此持仓？')) return;
  await deleteHoldingDB(document.getElementById('edit-overlay').dataset.id);
  closeEdit(); await render();
});

// 刷新价格
document.getElementById('refresh-btn').addEventListener('click', async () => {
  const btn    = document.getElementById('refresh-btn');
  const status = document.getElementById('refresh-status');
  const list   = allHoldings.filter(h => h.code && h.code.trim());

  if (!list.length) { status.textContent='没有填写股票代码的持仓'; return; }

  btn.style.opacity='0.5'; btn.disabled=true;
  status.textContent='更新中…';
  await fetchRates();

  let ok=0, fail=0;
  for (const h of list) {
    try {
      const res  = await fetch('/api/price?symbol='+encodeURIComponent(h.code.trim()));
      const data = await res.json();
      if (!data||!data.price) { fail++; continue; }

      await updateHoldingDB(h.id, {current_price:data.price});

      const origCur = getOriginalCur(h.code);
      const newMkt  = toDisp(Number(h.shares)*data.price, origCur);
      const newCost = toDisp(Number(h.shares)*Number(h.cost_price), origCur);
      const newPnl  = newMkt-newCost;
      const newPct  = newCost>0 ? newPnl/newCost*100 : 0;
      const cls     = newPnl>0?'up':newPnl<0?'down':'flat';
      const sign    = newPnl>=0?'+':'';
      const chg     = Number(data.changePct);

      const pxEl = document.getElementById('px-'+h.id);
      const mvEl = document.getElementById('mv-'+h.id);
      const plEl = document.getElementById('pl-'+h.id);
      if (pxEl) {
        pxEl.textContent = data.price.toFixed(2)+' ('+(chg>=0?'+':'')+chg.toFixed(2)+'%)';
        pxEl.style.color = data.change>=0?'var(--ok)':'var(--warn)';
      }
      if (mvEl) mvEl.textContent = fmtD(newMkt);
      if (plEl) { plEl.textContent=sign+fmtD(newPnl)+' ('+sign+newPct.toFixed(2)+'%)'; plEl.className='hc-pnl '+cls; }
      ok++;
    } catch { fail++; }
  }

  allHoldings = await loadHoldings();
  renderSummary(allHoldings);
  renderRisk(allHoldings);
  syncToAssets(); // 刷新价格后同步到资产页

  const t = new Date();
  status.textContent = `已更新 ${ok} 条${fail?'，'+fail+' 条失败':''}（${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}）`;
  btn.style.opacity='1'; btn.disabled=false;
});

// 初始化
async function init() {
  await requireAuth();
  await fetchRates();
  await render();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = '';
}
init();
</script>
