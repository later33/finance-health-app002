<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>财务健康 · 预算</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3"></script>
  <link rel="stylesheet" href="base.css">
  <style>
    /* ── 月份切换 ── */
    .month-bar { display:flex;align-items:center;justify-content:space-between;padding:0 24px 16px; }
    .month-btn { width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 0.15s; }
    .month-btn:active { background:var(--surface2); }
    .month-label { font-size:16px;font-weight:700;color:var(--text); }

    /* ── 总览卡 ── */
    .overview-card {
      margin:0 24px 16px;
      background:linear-gradient(135deg,#1a1f14,#141a1a);
      border-radius:20px;padding:20px;
      border:1px solid rgba(200,240,80,0.2);
      position:relative;overflow:hidden;
    }
    .overview-card::before {
      content:'';position:absolute;top:-40px;right:-40px;
      width:120px;height:120px;
      background:radial-gradient(circle,rgba(200,240,80,0.07) 0%,transparent 70%);
    }
    .ov-row { display:flex;justify-content:space-between;margin-bottom:14px; }
    .ov-item { text-align:center; }
    .ov-label { font-size:10px;color:var(--text-muted);margin-bottom:4px; }
    .ov-val   { font-size:18px;font-weight:700; }
    .ov-bar-bg   { height:8px;background:rgba(255,255,255,0.06);border-radius:8px; }
    .ov-bar-fill { height:8px;border-radius:8px;transition:width 0.8s cubic-bezier(0.22,1,0.36,1); }
    .ov-hint { font-size:11px;color:var(--text-muted);margin-top:8px;text-align:center; }

    /* ── 预算列表 ── */
    .budget-list { padding:0 24px;display:flex;flex-direction:column;gap:10px; }
    .budget-card {
      background:var(--surface);border-radius:16px;
      padding:14px 16px;border:1px solid var(--border);
      transition:border-color 0.2s;
    }
    .budget-card.over   { border-color:rgba(255,107,107,0.4); }
    .budget-card.near   { border-color:rgba(240,184,76,0.4); }
    .budget-card.ok     { border-color:rgba(92,240,176,0.2); }
    .budget-card.unset  { border-style:dashed; }

    .bc-top { display:flex;align-items:center;gap:10px;margin-bottom:10px; }
    .bc-icon { font-size:20px; }
    .bc-name { font-size:14px;font-weight:600;color:var(--text);flex:1; }
    .bc-status {
      font-size:11px;font-weight:600;padding:3px 10px;
      border-radius:20px;white-space:nowrap;
    }
    .st-over { background:var(--warn-dim);color:var(--warn); }
    .st-near { background:var(--mid-dim); color:var(--mid);  }
    .st-ok   { background:var(--ok-dim);  color:var(--ok);   }
    .st-unset{ background:rgba(255,255,255,0.05);color:var(--text-muted); }

    .bc-amounts {
      display:flex;justify-content:space-between;
      align-items:baseline;margin-bottom:8px;
    }
    .bc-spent { font-size:16px;font-weight:700; }
    .bc-limit { font-size:12px;color:var(--text-muted); }

    .bc-bar-bg   { height:6px;background:rgba(255,255,255,0.06);border-radius:6px;margin-bottom:8px; }
    .bc-bar-fill { height:6px;border-radius:6px;transition:width 0.8s cubic-bezier(0.22,1,0.36,1); }

    .bc-action {
      display:flex;align-items:center;justify-content:space-between;
    }
    .bc-remaining { font-size:11px;color:var(--text-muted); }
    .bc-edit-btn {
      font-size:11px;color:var(--accent);background:none;border:none;
      cursor:pointer;font-family:inherit;padding:2px 8px;
      border-radius:8px;background:var(--accent-dim);
      transition:opacity 0.15s;
    }
    .bc-edit-btn:active { opacity:0.7; }

    /* ── 빈 상태 / 无预算提示 ── */
    .no-budget {
      text-align:center;padding:32px 24px;
      color:var(--text-muted);font-size:13px;line-height:1.8;
    }
    .no-budget .ei { font-size:40px;margin-bottom:12px; }

    /* ── 编辑弹窗 ── */
    .modal-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:flex-end;justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { width:375px;background:var(--surface2);border-radius:28px 28px 0 0;padding:0 24px 40px;transform:translateY(100%);transition:transform 0.38s cubic-bezier(0.32,0.72,0,1);max-height:80vh;overflow-y:auto; }
    .modal-overlay.open .modal { transform:translateY(0); }
    .modal-handle { width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 18px; }
    .modal-title  { font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px; }
    .modal-sub    { font-size:13px;color:var(--text-muted);margin-bottom:20px; }

    .preset-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px; }
    .preset-btn {
      background:var(--surface);border:1.5px solid var(--border);
      border-radius:12px;padding:10px 4px;text-align:center;
      cursor:pointer;transition:all 0.15s;
    }
    .preset-btn:active { transform:scale(0.95); }
    .preset-btn-val { font-size:13px;font-weight:700;color:var(--accent); }
    .preset-btn-label { font-size:10px;color:var(--text-muted);margin-top:2px; }

    .field { margin-bottom:16px; }
    .field label { display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px; }
    .amount-wrap { position:relative; }
    .amount-prefix { position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted); }
    .field input {
      width:100%;height:52px;background:var(--surface);border:1.5px solid var(--border);
      border-radius:14px;padding:0 16px 0 28px;font-size:18px;font-weight:700;
      font-family:inherit;color:var(--text);outline:none;
      transition:border-color 0.15s;
    }
    .field input:focus { border-color:var(--accent); }
    .field input::placeholder { color:var(--text-muted);font-weight:400;font-size:15px; }

    .modal-btns { display:flex;gap:10px; }
    .save-btn {
      flex:1;height:52px;border:none;border-radius:16px;
      background:var(--accent);color:#0f0f13;
      font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;
      transition:transform 0.12s,opacity 0.12s;
    }
    .save-btn:active { transform:scale(0.97);opacity:0.9; }
    .save-btn:disabled { opacity:0.5;cursor:not-allowed; }
    .del-budget-btn {
      height:52px;padding:0 20px;border:1.5px solid rgba(255,107,107,0.3);
      border-radius:16px;background:var(--warn-dim);color:var(--warn);
      font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
      transition:transform 0.12s;
    }
    .del-budget-btn:active { transform:scale(0.97); }

    /* ── 加载 ── */
    .loading-screen { position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:200; }
    .spin { width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-screen p { font-size:13px;color:var(--text-muted); }
  </style>
</head>
<body>
<div class="loading-screen" id="loading"><div class="spin"></div><p>加载中…</p></div>

<div class="phone" id="app" style="display:none">
  <div class="status-bar">
    <span class="status-time" id="clock">9:41</span>
    <div class="status-icons"><svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="2.5" stroke="white" stroke-width="1.2" fill="none" opacity="0.8"/><rect x="1.5" y="2.5" width="16" height="7" rx="1.5" fill="white"/><rect x="23" y="4" width="2" height="4" rx="1" fill="white" opacity="0.5"/></svg></div>
  </div>

  <div class="screen-content">
    <div class="page-header">
      <div class="page-title">月度预算</div>
      <div class="page-sub" id="budget-sub">设定支出上限，避免超支</div>
    </div>

    <!-- 月份导航 -->
    <div class="month-bar">
      <div class="month-btn" id="prev-month">‹</div>
      <div class="month-label" id="month-display">—</div>
      <div class="month-btn" id="next-month">›</div>
    </div>

    <!-- 总览 -->
    <div class="overview-card" id="overview-card" style="display:none">
      <div class="ov-row">
        <div class="ov-item">
          <div class="ov-label">已设预算</div>
          <div class="ov-val" id="ov-total" style="color:var(--accent)">—</div>
        </div>
        <div class="ov-item">
          <div class="ov-label">已花费</div>
          <div class="ov-val" id="ov-spent" style="color:var(--text)">—</div>
        </div>
        <div class="ov-item">
          <div class="ov-label">剩余</div>
          <div class="ov-val" id="ov-remain">—</div>
        </div>
      </div>
      <div class="ov-bar-bg">
        <div class="ov-bar-fill" id="ov-bar"></div>
      </div>
      <div class="ov-hint" id="ov-hint"></div>
    </div>

    <!-- 预算列表 -->
    <div class="budget-list" id="budget-list"></div>

  </div>

  <nav class="nav-bar">
    <a href="index.html" class="nav-item"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="2" y="10" width="8" height="10" rx="2" fill="currentColor"/><rect x="12" y="2" width="8" height="18" rx="2" fill="currentColor" opacity="0.6"/></svg><span>总览</span></a>
    <a href="assets.html" class="nav-item"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="2" y="2" width="9" height="9" rx="2.5" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="2" width="7" height="9" rx="2.5" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="13" width="7" height="7" rx="2.5" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="13" width="7" height="7" rx="2.5" stroke="currentColor" stroke-width="1.5"/></svg><span>资产</span></a>
    <a href="cashflow.html" class="nav-item active"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 11h14M4 7l4-4 4 4M18 15l-4 4-4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>收支</span></a>
    <a href="budget.html" class="nav-item"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8.5" stroke="currentColor" stroke-width="1.5"/><path d="M11 7v4l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>预算</span></a>
    <a href="diagnosis.html" class="nav-item"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 17 L7 11 L11 14 L15 7 L19 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>诊断</span></a>
  </nav>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">设定预算</div>
    <div class="modal-sub" id="modal-sub">设定本月支出上限</div>

    <!-- 快速预设 -->
    <div class="preset-grid" id="preset-grid"></div>

    <div class="field">
      <label>自定义金额（元）</label>
      <div class="amount-wrap">
        <span class="amount-prefix">¥</span>
        <input type="number" id="input-amount" placeholder="输入金额" min="0" inputmode="decimal">
      </div>
    </div>

    <div class="modal-btns">
      <button class="save-btn" id="save-btn">保存预算</button>
      <button class="del-budget-btn" id="del-btn" style="display:none">删除</button>
    </div>
  </div>
</div>

<script src="js/finance.js"></script>
<script src="supabase.js"></script>
<script>
// ── 支出分类（与 cashflow 一致）──────────────────────────
const EXPENSE_CATS = [
  { id:'housing',   label:'住房',  icon:'🏠', presets:[2000,3000,5000,8000] },
  { id:'food',      label:'餐饮',  icon:'🍜', presets:[800,1500,2500,4000]  },
  { id:'transport', label:'交通',  icon:'🚇', presets:[200,500,1000,2000]   },
  { id:'shopping',  label:'购物',  icon:'🛍️', presets:[500,1000,2000,5000]  },
  { id:'medical',   label:'医疗',  icon:'🏥', presets:[200,500,1000,3000]   },
  { id:'education', label:'教育',  icon:'📚', presets:[500,1000,2000,5000]  },
  { id:'entertain', label:'娱乐',  icon:'🎬', presets:[200,500,1000,2000]   },
  { id:'other',     label:'其他',  icon:'📦', presets:[200,500,1000,3000]   },
];

// ── 状态 ────────────────────────────────────────────────
let currentMonth = '';
let budgets = {};       // { category: amount }
let cfRows   = [];
let editCat  = null;

// ── 月份工具 ────────────────────────────────────────────
function allMonths() {
  const months = [];
  const now = new Date();
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  return months;
}
function fmtMonth(ym) {
  if (!ym) return '—';
  const [y,m] = ym.split('-');
  return `${y}年 ${parseInt(m)}月`;
}

// 时钟
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
}
updateClock(); setInterval(updateClock, 10000);

// ── Supabase 预算 CRUD ───────────────────────────────────
async function loadBudgets(month) {
  const { data, error } = await sb.from('budgets')
    .select('*').eq('month', month);
  if (error) { console.error(error); return {}; }
  const result = {};
  data.forEach(r => { result[r.category] = r.amount; });
  return result;
}

async function saveBudget(month, category, amount) {
  const user = await getUser();
  // upsert: 先删再插
  await sb.from('budgets').delete()
    .eq('user_id', user.id).eq('month', month).eq('category', category);
  if (amount > 0) {
    await sb.from('budgets').insert({
      user_id: user.id, month, category, amount
    });
  }
}

// ── 主渲染 ───────────────────────────────────────────────
async function render() {
  const user = await requireAuth();
  if (!user) return;

  if (!currentMonth) {
    const now = new Date();
    currentMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  }

  const months = allMonths();
  document.getElementById('month-display').textContent = fmtMonth(currentMonth);
  document.getElementById('prev-month').style.opacity = months.indexOf(currentMonth) > 0 ? '1' : '0.3';
  document.getElementById('next-month').style.opacity = months.indexOf(currentMonth) < months.length-1 ? '1' : '0.3';
  document.getElementById('budget-sub').textContent = fmtMonth(currentMonth) + '支出计划';

  [budgets, cfRows] = await Promise.all([
    loadBudgets(currentMonth),
    dbLoadCashflow(currentMonth),
  ]);

  renderOverview();
  renderList();

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = '';
}

function getSpent(catId) {
  return cfRows
    .filter(r => r.type === 'expense' && r.category === catId)
    .reduce((s, r) => s + Number(r.amount), 0);
}

function renderOverview() {
  const hasBudgets = Object.keys(budgets).length > 0;
  document.getElementById('overview-card').style.display = hasBudgets ? '' : 'none';
  if (!hasBudgets) return;

  const totalBudget = Object.values(budgets).reduce((s, v) => s + v, 0);
  const totalSpent  = EXPENSE_CATS.reduce((s, c) => s + getSpent(c.id), 0);
  const remain      = totalBudget - totalSpent;
  const pct         = totalBudget > 0 ? Math.min(100, (totalSpent / totalBudget) * 100) : 0;

  document.getElementById('ov-total').textContent  = fmt(totalBudget);
  document.getElementById('ov-spent').textContent  = fmt(totalSpent);
  const remEl = document.getElementById('ov-remain');
  remEl.textContent  = fmt(Math.abs(remain));
  remEl.style.color  = remain >= 0 ? 'var(--ok)' : 'var(--warn)';

  const bar = document.getElementById('ov-bar');
  bar.style.width      = pct + '%';
  bar.style.background = pct >= 100 ? 'var(--warn)' : pct >= 80 ? 'var(--mid)' : 'var(--ok)';

  document.getElementById('ov-hint').textContent =
    pct >= 100 ? `⚠️ 本月总支出已超预算 ${fmt(Math.abs(remain))}` :
    pct >= 80  ? `⏳ 已用 ${pct.toFixed(0)}%，还剩 ${fmt(remain)}` :
                 `✅ 还剩 ${fmt(remain)}，预算执行良好`;
}

function renderList() {
  const listEl = document.getElementById('budget-list');
  listEl.innerHTML = '';

  EXPENSE_CATS.forEach((cat, idx) => {
    const limit = budgets[cat.id] || 0;
    const spent = getSpent(cat.id);
    const pct   = limit > 0 ? Math.min(100, (spent / limit) * 100) : 0;
    const remain = limit - spent;

    let state = 'unset';
    let barColor = 'var(--ok)';
    let statusText = '未设定';
    let statusClass = 'st-unset';

    if (limit > 0) {
      if (pct >= 100)     { state='over'; barColor='var(--warn)'; statusText=`超支 ${fmt(Math.abs(remain))}`; statusClass='st-over'; }
      else if (pct >= 80) { state='near'; barColor='var(--mid)';  statusText=`剩 ${fmt(remain)}`;            statusClass='st-near'; }
      else                { state='ok';   barColor='var(--ok)';   statusText=`剩 ${fmt(remain)}`;            statusClass='st-ok';   }
    }

    const card = document.createElement('div');
    card.className = `budget-card ${state}`;
    card.style.animationDelay = `${idx * 0.04}s`;
    card.innerHTML = `
      <div class="bc-top">
        <span class="bc-icon">${cat.icon}</span>
        <span class="bc-name">${cat.label}</span>
        <span class="bc-status ${statusClass}">${statusText}</span>
      </div>
      <div class="bc-amounts">
        <span class="bc-spent" style="color:${limit>0?(pct>=100?'var(--warn)':pct>=80?'var(--mid)':'var(--text)'):'var(--text-muted)'}">${fmt(spent)}</span>
        <span class="bc-limit">${limit > 0 ? '/ ' + fmt(limit) : '点击设定预算'}</span>
      </div>
      ${limit > 0 ? `
      <div class="bc-bar-bg">
        <div class="bc-bar-fill" style="width:${pct}%;background:${barColor}"></div>
      </div>` : ''}
      <div class="bc-action">
        <span class="bc-remaining">${spent > 0 && limit === 0 ? `本月已花 ${fmt(spent)}` : ''}</span>
        <button class="bc-edit-btn" data-cat="${cat.id}">${limit > 0 ? '修改' : '＋ 设定'}</button>
      </div>`;
    listEl.appendChild(card);
  });

  listEl.querySelectorAll('.bc-edit-btn').forEach(btn => {
    btn.addEventListener('click', () => openModal(btn.dataset.cat));
  });
}

// ── 月份导航 ─────────────────────────────────────────────
document.getElementById('prev-month').addEventListener('click', () => {
  const months = allMonths();
  const idx = months.indexOf(currentMonth);
  if (idx > 0) { currentMonth = months[idx-1]; render(); }
});
document.getElementById('next-month').addEventListener('click', () => {
  const months = allMonths();
  const idx = months.indexOf(currentMonth);
  if (idx < months.length-1) { currentMonth = months[idx+1]; render(); }
});

// ── 弹窗 ─────────────────────────────────────────────────
function openModal(catId) {
  editCat = catId;
  const cat     = EXPENSE_CATS.find(c => c.id === catId);
  const current = budgets[catId] || 0;

  document.getElementById('modal-title').textContent = `${cat.icon} ${cat.label}预算`;
  document.getElementById('modal-sub').textContent   = `本月 ${cat.label} 建议预算`;
  document.getElementById('input-amount').value      = current || '';

  // 删除按钮
  const delBtn = document.getElementById('del-btn');
  delBtn.style.display = current > 0 ? '' : 'none';

  // 快速预设
  const grid = document.getElementById('preset-grid');
  grid.innerHTML = '';
  cat.presets.forEach(p => {
    const btn = document.createElement('div');
    btn.className = 'preset-btn';
    btn.innerHTML = `<div class="preset-btn-val">${fmt(p)}</div><div class="preset-btn-label">参考值</div>`;
    btn.addEventListener('click', () => {
      document.getElementById('input-amount').value = p;
      document.getElementById('input-amount').focus();
    });
    grid.appendChild(btn);
  });

  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('input-amount').focus(), 350);
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') document.getElementById('modal').classList.remove('open');
});

document.getElementById('save-btn').addEventListener('click', async () => {
  const amount = parseFloat(document.getElementById('input-amount').value);
  if (!amount || amount <= 0) { alert('请填写正确的金额'); return; }
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = '保存中…';
  await saveBudget(currentMonth, editCat, amount);
  btn.disabled = false; btn.textContent = '保存预算';
  document.getElementById('modal').classList.remove('open');
  budgets = await loadBudgets(currentMonth);
  renderOverview();
  renderList();
});

document.getElementById('del-btn').addEventListener('click', async () => {
  if (!confirm(`确认删除 ${EXPENSE_CATS.find(c=>c.id===editCat)?.label} 的预算设定？`)) return;
  await saveBudget(currentMonth, editCat, 0);
  document.getElementById('modal').classList.remove('open');
  budgets = await loadBudgets(currentMonth);

});

render();
</script>
